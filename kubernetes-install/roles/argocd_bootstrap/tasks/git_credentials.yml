---
# Для первой установки Secret создаёт Ansible из секрет-бэкенда. После
# запуска External Secrets Operator управление credentials передаётся ему:
# в Git хранится ExternalSecret, ссылающийся на OpenBao (раздел 18.2).
#
# Публичному репозиторию по HTTPS credentials не нужны вовсе — Argo CD
# читает его анонимно, и создавать пустой Secret незачем.

- name: Report anonymous access to a public repository
  ansible.builtin.debug:
    msg: >-
      {{ gitops.repo_url }} доступен по HTTPS без аутентификации —
      Secret с credentials не создаётся. Для приватного репозитория
      используйте ssh:// с деплой-ключом (раздел 18.2).
  when: not (gitops_url_is_ssh | bool)

- name: Create repository credentials for SSH access
  when: gitops_url_is_ssh | bool
  block:
    - name: Check whether the repository secret is already managed by ExternalSecret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Secret
        namespace: "{{ argocd.namespace }}"
        name: "{{ argocd_repo_secret_name }}"
      register: argocd_existing_repo_secret
      failed_when: false

    - name: Determine ExternalSecret ownership
      # Если Secret создан ESO, у него есть owner reference на ExternalSecret.
      # Перезаписывать такой Secret нельзя: ESO вернёт своё значение,
      # и получится непрерывная борьба двух источников.
      ansible.builtin.set_fact:
        argocd_repo_secret_managed_by_eso: >-
          {{ (argocd_existing_repo_secret.resources | default([]) | length > 0)
             and (argocd_existing_repo_secret.resources[0].metadata.ownerReferences | default([])
                  | selectattr('kind', 'equalto', 'ExternalSecret') | list | length > 0) }}

    - name: Create the repository credentials secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ argocd_repo_secret_name }}"
            namespace: "{{ argocd.namespace }}"
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: git
            url: "{{ gitops.repo_url }}"
            sshPrivateKey: "{{ gitops_deploy_key }}"
      when: not argocd_repo_secret_managed_by_eso | bool
      no_log: true

    - name: Report ExternalSecret ownership
      ansible.builtin.debug:
        msg: >-
          Secret {{ argocd_repo_secret_name }} управляется External Secrets
          Operator — Ansible его не трогает.
      when: argocd_repo_secret_managed_by_eso | bool
