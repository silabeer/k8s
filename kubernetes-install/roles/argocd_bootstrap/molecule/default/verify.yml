---
- name: Verify
  hosts: control_plane[0]
  become: true
  gather_facts: true

  tasks:
    - name: Get Argo CD pods
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Pod
        namespace: "{{ argocd.namespace }}"
      register: argocd_pods

    - name: Assert every Argo CD pod is running
      vars:
        unhealthy: >-
          {{ argocd_pods.resources
             | rejectattr('status.phase', 'in', ['Running', 'Succeeded'])
             | map(attribute='metadata.name') | list }}
      ansible.builtin.assert:
        that:
          - argocd_pods.resources | length > 0
          - unhealthy | length == 0
        fail_msg: "Pod'ы Argo CD не в порядке: {{ unhealthy }}"
        quiet: true

    - name: Get the root Application
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: "{{ argocd.namespace }}"
        name: "{{ argocd_root_app_name }}"
      register: root_app

    - name: Assert the root Application exists
      ansible.builtin.assert:
        that:
          - root_app.resources | length > 0
        fail_msg: "Root Application не создан."
        quiet: true

    # С finalizer случайное удаление cluster-bootstrap каскадно снесёт всю
    # кластерную конфигурацию (раздел 18.3).
    - name: Assert the root Application has no cascading finalizer
      ansible.builtin.assert:
        that:
          - "'resources-finalizer.argocd.argoproj.io'
             not in (root_app.resources[0].metadata.finalizers | default([]))"
        fail_msg: >-
          На root Application стоит finalizer — его удаление уничтожит
          конфигурацию кластера.
        quiet: true

    - name: Assert automation is off for the initial bootstrap
      ansible.builtin.assert:
        that:
          - root_app.resources[0].spec.syncPolicy.automated is not defined
        fail_msg: >-
          На root Application включена автоматика. При первом bootstrap
          ошибка в путях ApplicationSet приведёт к массовому prune ещё до
          того, как кто-либо посмотрит diff (S9).
        quiet: true
      when: not argocd.root_app_automated | bool

    - name: Assert no helm release secret exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Secret
        namespace: "{{ argocd.namespace }}"
        label_selectors: ["owner=helm"]
      register: helm_secrets
      failed_when: helm_secrets.resources | length > 0

    - name: Assert the repository credentials secret exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Secret
        namespace: "{{ argocd.namespace }}"
        name: "{{ argocd_repo_secret_name }}"
      register: repo_secret
      failed_when: repo_secret.resources | length == 0

    - name: Assert the credentials secret is labelled for Argo CD
      ansible.builtin.assert:
        that:
          - repo_secret.resources[0].metadata.labels['argocd.argoproj.io/secret-type'] == 'repository'
        fail_msg: >-
          Secret не помечен как repository — Argo CD его не увидит.
        quiet: true

    # Проверка того, что деплой-ключ не утёк в артефакты прогона
    # (раздел 25.4).
    - name: Search molecule artifacts for the private key marker
      ansible.builtin.command:
        cmd: "grep -rl 'BEGIN OPENSSH PRIVATE KEY' /var/log /tmp"
      register: leaked
      changed_when: false
      failed_when: false

    - name: Assert no private key was written to logs or temp files
      ansible.builtin.assert:
        that:
          - leaked.stdout_lines | length == 0
        fail_msg: >-
          Приватный ключ найден в {{ leaked.stdout_lines }}.
          Задачи с credentials обязаны выполняться под no_log: true
          (раздел 29.3).
        quiet: true

    - name: Assert the GitOps checkout was cleaned up
      ansible.builtin.stat:
        path: "{{ argocd_checkout_dir }}"
      register: checkout
      failed_when: checkout.stat.exists
