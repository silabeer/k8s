---
# Требует тестового GitOps-репозитория с values/argocd.yaml и
# bootstrap/root-application.yaml, а также деплой-ключа (CI variables,
# отдельные от production — раздел 25.5).
- name: Converge
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Assert the test GitOps repository is configured
      ansible.builtin.assert:
        that:
          - lookup('env', 'MOLECULE_GITOPS_REPO') | length > 0
        fail_msg: >-
          Задайте MOLECULE_GITOPS_REPO: root Application берётся из
          репозитория, собственного шаблона у Ansible нет (S8).
        quiet: true

    # URL репозитория приходит из molecule-shared/group_vars/all.yml,
    # который читает MOLECULE_GITOPS_REPO. Переопределять его здесь не нужно.
    - name: Apply the argocd_bootstrap role
      ansible.builtin.include_role:
        name: argocd_bootstrap
