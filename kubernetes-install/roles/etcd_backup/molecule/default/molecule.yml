---
# Кластерный сценарий на docker-драйвере: kubeadm поднимается внутри
# контейнеров, как это делает kind.
#
# Требования к контейнеру-узлу:
#   privileged        — монтирование, cgroup, iptables;
#   cgroupns_mode host — cgroup v2 для kubelet и containerd;
#   /lib/modules ro   — kubelet и Cilium читают сведения о модулях;
#   /dev/kmsg         — без него kubelet не стартует;
#   анонимный том на /var/lib/containerd — overlayfs поверх overlayfs
#                       не работает, снапшоттеру нужна настоящая ФС.
#
# Сеть и имена контейнеров уникальны для каждого сценария: destroy удаляет
# сеть, и общая сеть у параллельных сценариев в CI приводила бы к гонке.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-etcdbak-cp-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
      - /var/lib/containerd
      - /var/lib/kubelet
      - /var/lib/etcd
    tmpfs: [/run, /tmp]
    devices:
      - /dev/kmsg:/dev/kmsg:rwm
    # Сеть объявляется один раз, на первой платформе
    docker_networks:
      - name: molecule-etcdbak
        ipam_config:
          - subnet: 172.30.6.0/24
    networks:
      - name: molecule-etcdbak
        ipv4_address: 172.30.6.21
    groups: [control_plane, kubernetes]

  - name: molecule-etcdbak-worker-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
      - /var/lib/containerd
      - /var/lib/kubelet
    tmpfs: [/run, /tmp]
    devices:
      - /dev/kmsg:/dev/kmsg:rwm
    networks:
      - name: molecule-etcdbak
        ipv4_address: 172.30.6.31
    groups: [workers, kubernetes]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../../../molecule-shared/group_vars
    host_vars:
      molecule-etcdbak-cp-01:
        node_ip: 172.30.6.21
      molecule-etcdbak-worker-01:
        node_ip: 172.30.6.31
    group_vars:
      all:
        # Выделенной пары LB на малом стенде нет: endpoint указывает прямо
        # на control-plane узел. Для production так делать нельзя (раздел 3.2),
        # но здесь проверяется не отказоустойчивость VIP.
        api_vip: "172.30.6.21"
        api_vip_managed: false
        control_plane_endpoint_host: "k8s-api.molecule.test"
        corporate_networks: ["172.30.6.0/24"]
      control_plane:
        preflight_min_cpu: 1
        preflight_min_ram_mb: 900
        preflight_min_disk_root_gb: 5
      workers:
        preflight_min_cpu: 1
        preflight_min_ram_mb: 900
        preflight_min_disk_root_gb: 5
        node_pool: general

verifier:
  name: ansible
