---
# Сценарий проверяет АЛЬТЕРНАТИВНЫЙ механизм — systemd timer. Основной
# (CronJob из GitOps, wave 0) в кластере без Argo CD не проверить, поэтому
# для него роль лишь рендерит референсный манифест, и он тоже верифицируется.
- name: Converge
  hosts: control_plane
  become: true
  tasks:
    - name: Apply the etcd_backup role with the timer enabled
      ansible.builtin.include_role:
        name: etcd_backup
      vars:
        etcd_backup_enabled: true
        etcd_backup_upload_enabled: false
