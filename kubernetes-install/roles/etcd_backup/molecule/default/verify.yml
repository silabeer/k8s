---
- name: Verify
  hosts: control_plane
  become: true
  gather_facts: true

  tasks:
    - name: Assert the timer is enabled and active  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "systemctl is-{{ item }} etcd-backup.timer"
      register: timer_state
      changed_when: false
      failed_when: timer_state.stdout | trim not in ['active', 'enabled']
      loop: [active, enabled]

    - name: Read the timer schedule  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl show etcd-backup.timer --property=TimersCalendar
      register: timer_schedule
      changed_when: false

    - name: Assert the snapshot runs at least daily
      ansible.builtin.assert:
        that:
          - timer_schedule.stdout is search('\*-\*-\*')
        fail_msg: >-
          Расписание не ежедневное. Для prod требуется не реже раза в сутки
          (раздел 28.1).
        quiet: true

    - name: Find snapshot files
      ansible.builtin.find:
        paths: "{{ etcd_backup_dir }}"
        patterns: "etcd-snapshot-*.db"
      register: snapshots

    - name: Assert a snapshot was produced by the verification run
      ansible.builtin.assert:
        that:
          - snapshots.files | length > 0
        fail_msg: "Проверочный запуск не создал ни одного snapshot."
        quiet: true

    - name: Assert snapshots are not world-readable
      ansible.builtin.assert:
        that:
          - item.mode == '0600'
        fail_msg: >-
          Snapshot {{ item.path }} доступен на чтение не только root.
          Он содержит все объекты кластера, включая Secrets.
        quiet: true
      loop: "{{ snapshots.files }}"
      loop_control:
        label: "{{ item.path }}"

    # Snapshot внутри dataDir попал бы в следующий snapshot и рос рекурсивно.
    - name: Assert no snapshot was left in the etcd data directory
      ansible.builtin.find:
        paths: /var/lib/etcd
        patterns: "*.db"
        recurse: false
      register: leftover
      failed_when: leftover.files | length > 0

    - name: Read the reference CronJob manifest
      ansible.builtin.slurp:
        src: "{{ etcd_backup_cronjob_reference_path }}"
      register: cronjob_ref

    # Без hostNetwork Pod не достучится до 127.0.0.1:2379, без tolerations
    # не запланируется на control-plane (S12).
    - name: Assert the reference CronJob carries the details that are easy to miss
      vars:
        manifest: "{{ cronjob_ref.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - manifest is search('hostNetwork:\s*true')
          - manifest is search('node-role.kubernetes.io/control-plane')
          - manifest is search('tolerations:')
        fail_msg: >-
          В референсном манифесте CronJob не хватает hostNetwork или
          tolerations — такой Pod либо не запланируется, либо не достучится
          до etcd.
        quiet: true
