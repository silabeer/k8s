---
# Разовый snapshot. Используется playbook обновления перед началом работ
# (playbooks/upgrade/00-preflight.yml).
#
# Snapshot сначала создаётся внутри /var/lib/etcd — этот каталог смонтирован
# в Pod etcd как hostPath, поэтому файл виден и из Pod, и с хоста. Проверка
# целостности выполняется, пока файл ещё доступен Pod'у, и только потом он
# переносится в каталог бэкапов.

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ etcd_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Build snapshot names
  ansible.builtin.set_fact:
    etcd_backup_pod: "etcd-{{ inventory_hostname }}"
    etcd_backup_filename: "etcd-snapshot-{{ now(utc=true, fmt='%Y%m%dT%H%M%S') }}.db"

- name: Take an etcd snapshot
  ansible.builtin.command:
    cmd: >-
      kubectl -n kube-system exec {{ etcd_backup_pod }} --
      etcdctl
      --endpoints={{ etcd_backup_endpoints }}
      --cacert={{ etcd_backup_cacert }}
      --cert={{ etcd_backup_cert }}
      --key={{ etcd_backup_key }}
      snapshot save /var/lib/etcd/{{ etcd_backup_filename }}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Verify snapshot integrity
  # etcdutl, а не etcdctl: в etcd 3.5+ работа с файлами snapshot вынесена
  # в отдельную утилиту, `etcdctl snapshot status` объявлен устаревшим.
  ansible.builtin.command:
    cmd: >-
      kubectl -n kube-system exec {{ etcd_backup_pod }} --
      etcdutl snapshot status /var/lib/etcd/{{ etcd_backup_filename }} -w json
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  register: etcd_backup_status

- name: Assert the snapshot contains data
  ansible.builtin.assert:
    that:
      - (etcd_backup_status.stdout | from_json).totalKey | int > 0
      - (etcd_backup_status.stdout | from_json).totalSize | int > 0
    fail_msg: "Snapshot пуст или повреждён: {{ etcd_backup_status.stdout }}"
    quiet: true

# Snapshot, оставленный внутри dataDir, попадёт в следующий snapshot
# и будет расти рекурсивно.
- name: Move the snapshot out of the etcd data directory
  ansible.builtin.command:
    cmd: "mv /var/lib/etcd/{{ etcd_backup_filename }} {{ etcd_backup_dir }}/{{ etcd_backup_filename }}"
    removes: "/var/lib/etcd/{{ etcd_backup_filename }}"
  changed_when: true

- name: Report the snapshot
  vars:
    status: "{{ etcd_backup_status.stdout | from_json }}"
  ansible.builtin.debug:
    msg: >-
      Snapshot {{ etcd_backup_dir }}/{{ etcd_backup_filename }} создан:
      {{ status.totalKey }} ключей, {{ (status.totalSize | int / 1024 / 1024) | round(1) }} MB,
      revision {{ status.revision }}.
      ВАЖНО: без ключа шифрования etcd из OpenBao этот snapshot невосстановим —
      Secrets в нём зашифрованы (раздел 28.2).
