---
# Каталог создают bootstrap-роли, а они выполняются только на первом
# control-plane узле. Без этой задачи роль падала на остальных узлах
# и systemd timer там не настраивался вовсе.
- name: Ensure the directory for the reference manifest exists
  ansible.builtin.file:
    path: "{{ etcd_backup_cronjob_reference_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: etcd_backup_render_cronjob_reference | bool

# Версия берётся из живого манифеста, а не оставляется плейсхолдером:
# забытый плейсхолдер даёт задание, которое не запустится.
- name: Read the etcd static pod manifest
  ansible.builtin.slurp:
    src: /etc/kubernetes/manifests/etcd.yaml
  register: etcd_backup_etcd_manifest
  failed_when: false
  when: etcd_backup_render_cronjob_reference | bool

- name: Detect the etcd image used by the cluster
  ansible.builtin.set_fact:
    etcd_backup_detected_image: >-
      {{ (etcd_backup_etcd_manifest.content | b64decode
          | regex_search('image:\s*(\S+)', '\1') | first) }}
  when:
    - etcd_backup_render_cronjob_reference | bool
    - etcd_backup_etcd_manifest.content is defined

- name: Render the reference CronJob manifest for the GitOps repository
  ansible.builtin.template:
    src: etcd-backup-cronjob.yaml.j2
    dest: "{{ etcd_backup_cronjob_reference_path }}"
    owner: root
    group: root
    mode: "0644"
  when: etcd_backup_render_cronjob_reference | bool

- name: Report the reference manifest
  ansible.builtin.debug:
    msg: >-
      Референсный манифест CronJob записан в
      {{ etcd_backup_cronjob_reference_path }}. Скопируйте его в
      infrastructure/etcd-backup/ GitOps-репозитория — это основной механизм
      резервного копирования (раздел 28.1). systemd timer ниже — альтернатива
      для контуров, где hostPath запрещён.
  when: etcd_backup_render_cronjob_reference | bool

- name: Configure the systemd timer
  ansible.builtin.import_tasks: systemd_timer.yml
  when: etcd_backup_enabled | bool

- name: Report disabled timer
  ansible.builtin.debug:
    msg: >-
      etcd_backup_enabled=false — systemd timer не настроен. Резервное
      копирование выполняет CronJob из GitOps.
  when: not etcd_backup_enabled | bool
