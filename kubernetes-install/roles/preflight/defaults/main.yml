---
# Пороги переопределяются в group_vars каждой группы (control_plane, workers,
# load_balancers). Здесь — безопасный минимум.
# Дублируется из роли haproxy_keepalived намеренно: defaults одной роли
# в другой не видны, а роль обязана оставаться самодостаточной.
# Значение из inventory перекрывает оба места и держит их в согласии.
keepalived_enabled: true

# Доверие к сертификату OpenBao. Проверка доступности выполняется модулем
# uri НА УЗЛЕ, поэтому переменные окружения lookup-плагина
# (ANSIBLE_HASHI_VAULT_CA_CERT) на неё не действуют.
#
# В production внутренний CA обычно уже лежит в системном хранилище узла —
# тогда оба параметра не нужны. Задавать их приходится там, где OpenBao
# работает с самоподписанным или частным сертификатом.
#
#   openbao_ca_cert      — содержимое PEM (из inventory или секрет-бэкенда)
#   openbao_ca_cert_path — путь к уже лежащему на узле файлу
openbao_ca_cert: ~
openbao_ca_cert_path: ~

preflight_min_cpu: 2
preflight_min_ram_mb: 2000
preflight_min_disk_root_gb: 20
preflight_min_disk_etcd_gb: 20
preflight_required_ports: []

# Обязательные переменные. Проверяются первой задачей роли: ошибка приходит
# за секунды, а не на этапе 30 (раздел 3.4 spec).
preflight_required_vars:
  - cluster_name
  - cluster_environment
  - kubernetes_version
  - kubernetes_apt_version
  - containerd_version
  - runc_version
  - cni_plugins_version
  - crictl_version
  - helm_version
  - pause_image_tag
  - api_vip
  - control_plane_endpoint_host
  - pod_network_cidr
  - service_network_cidr
  - registry_host

preflight_supported_distributions:
  Ubuntu:
    - "22.04"
    - "24.04"
preflight_min_kernel_version: "5.15"

preflight_check_registry: true
preflight_check_git: true

# Требовать заданный gitops.repo_url. Выключается только при поэтапном
# развёртывании, когда репозиторий появится позже этапов 00-42.
preflight_require_gitops: true
preflight_check_helm_source: true
preflight_check_package_repo: true
preflight_check_artifacts: true
preflight_check_connectivity: true

# MTU задаётся сетевой инфраструктурой и в контейнере не совпадает с
# производственным значением.
preflight_check_mtu: true

# Наличие работающего NTP-демона. Фактическое расхождение часов проверяется
# всегда, независимо от этого флага.
preflight_check_timesync_service: true

preflight_connect_timeout: 10
preflight_ntp_max_offset: "{{ ntp_max_offset_seconds | default(1) }}"

# Узлы, которыми управляет этот проект: control-plane, worker и LB.
#
# Не groups['all']: inventory может содержать посторонние хосты — localhost
# провижнера, узлы соседних систем, — у которых нет node_ip, и проверка
# падала бы на них с невнятной ошибкой.
cluster_hosts: "{{ (groups['kubernetes'] | default([])) + (groups['load_balancers'] | default([])) }}"

# -----------------------------------------------------------------------------
# Закрытый контур
#
# closed_contour: true означает, что артефакты берутся только из реестра и
# внутренних зеркал. Включает проверку источников — см.
# tasks/check_artifact_sources.yml.
# -----------------------------------------------------------------------------
closed_contour: false

# Хосты, попадание на которые считается выходом в интернет. Список
# намеренно перечисляет то, что встречается в умолчаниях ролей этого
# проекта: проверка должна ловить именно забытое переопределение.
closed_contour_public_hosts:
  - github.com
  - raw.githubusercontent.com
  - objects.githubusercontent.com
  - get.helm.sh
  - pkgs.k8s.io
  - registry.k8s.io
  - quay.io
  - ghcr.io
  - docker.io
  - registry-1.docker.io
  - gcr.io
  - k8s.gcr.io
  - helm.cilium.io
  - charts.jetstack.io
  - argoproj.github.io
  - kubernetes-sigs.github.io
  - postfinance.github.io

# Необязательный белый список. Пустой — подойдёт любой непубличный адрес.
closed_contour_allowed_hosts: []
