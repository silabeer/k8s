---
# Проверки корректности inventory. Все — run_once, данные берутся из hostvars.

- name: Assert hostnames are unique
  vars:
    all_hostnames: "{{ cluster_hosts | map('extract', hostvars, 'ansible_hostname') | list }}"
  ansible.builtin.assert:
    that:
      - all_hostnames | length == all_hostnames | unique | length
    fail_msg: >-
      Обнаружены дублирующиеся hostname: {{
        all_hostnames | community.general.counter
        | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | list
      }}
    quiet: true
  run_once: true

# Расхождение имени фатально только если его никто не исправит: os_prepare
# на этапе 10 приводит hostname к inventory_hostname. Жёсткий отказ здесь
# создавал бы порочный круг — preflight не пропускает узел, который сам же
# проект и должен переименовать.
- name: Assert inventory hostname matches actual hostname
  ansible.builtin.assert:
    that:
      - inventory_hostname == ansible_hostname
    fail_msg: >-
      inventory_hostname `{{ inventory_hostname }}` не совпадает с фактическим
      hostname `{{ ansible_hostname }}`, а os_prepare_manage_hostname выключен —
      значит, имя никто не исправит. kubeadm регистрирует узел под фактическим
      именем, из-за расхождения сломается delegate_to и назначение labels.
    quiet: true
  when:
    - inventory_hostname in groups['kubernetes']
    - not (os_prepare_manage_hostname | default(true) | bool)

- name: Report hostname that will be changed
  ansible.builtin.debug:
    msg: >-
      Фактический hostname `{{ ansible_hostname }}` будет изменён на
      `{{ inventory_hostname }}` ролью os_prepare (этап 10).
  when:
    - inventory_hostname in groups['kubernetes']
    - inventory_hostname != ansible_hostname
    - os_prepare_manage_hostname | default(true) | bool

- name: Assert node addresses are unique
  vars:
    all_ips: "{{ cluster_hosts | map('extract', hostvars, 'node_ip') | list }}"
  ansible.builtin.assert:
    that:
      - all_ips | length == all_ips | unique | length
    fail_msg: "Обнаружены дублирующиеся IP-адреса в inventory: {{ all_ips }}"
    quiet: true
  run_once: true

- name: Assert control plane has an odd number of nodes
  ansible.builtin.assert:
    that:
      - groups['control_plane'] | length is odd
      - groups['control_plane'] | length >= 1
    fail_msg: >-
      Control plane содержит {{ groups['control_plane'] | length }} узлов.
      etcd требует нечётного числа членов для кворума.
    quiet: true
  run_once: true

- name: Warn about non-HA control plane
  ansible.builtin.debug:
    msg: >-
      ВНИМАНИЕ: control plane из {{ groups['control_plane'] | length }} узла.
      Для prod требуется минимум 3 (раздел 3.1).
  when:
    - groups['control_plane'] | length < 3
    - cluster_environment == 'prod'
  run_once: true

# Значение берётся из hostvars балансировщиков, а не текущего хоста:
# задачи ниже выполняются с run_once, то есть на ПЕРВОМ хосте play, а он
# может не входить в load_balancers — тогда keepalived_enabled разрешился бы
# в значение по умолчанию, а не в заданное группе.
#
# Список с добавленным [true] на конце вместо `| first` по возможно пустой
# последовательности: `first` от пустого списка роняет задачу на рендере
# сообщения, пряча настоящую причину.
- name: Determine whether load balancers manage a VIP through keepalived
  ansible.builtin.set_fact:
    preflight_keepalived_enabled: >-
      {{ (groups['load_balancers'] | default([])
          | map('extract', hostvars, 'keepalived_enabled')
          | select('defined') | list + [true]) | first | bool }}
  run_once: true

# Пара нужна ровно тогда, когда отказоустойчивость обеспечивает keepalived.
# Без него балансировщик один по построению: общего адреса нет, и второму
# узлу трафик взять неоткуда. Отождествлять «управляем балансировщиком» с
# «поднимаем VIP» нельзя — это разные вещи.
- name: Assert load balancer pair is defined when a VIP is managed here
  ansible.builtin.assert:
    that:
      - groups['load_balancers'] | default([]) | length >= 2
    fail_msg: >-
      api_vip_managed=true с keepalived требует минимум двух LB-узлов для
      отказоустойчивости VIP. Для одиночного балансировщика задайте
      keepalived_enabled=false — отказоустойчивость тогда обеспечивается
      снаружи (docs/adr/0001-kube-proxy-replacement.md, раздел 4.1).
    quiet: true
  when:
    - api_vip_managed | bool
    - preflight_keepalived_enabled | bool
  run_once: true

- name: Warn about a load balancer without failover
  ansible.builtin.debug:
    msg: >-
      ВНИМАНИЕ: балансировщик один и keepalived выключен. Endpoint
      {{ api_vip }} — точка отказа: его потеря лишает доступа к API весь
      кластер. Для prod требуется пара с общим VIP либо внешняя
      отказоустойчивость.
  when:
    - api_vip_managed | bool
    - not (preflight_keepalived_enabled | bool)
  run_once: true

- name: Assert keepalived priorities are unique
  vars:
    priorities: >-
      {{ groups['load_balancers'] | map('extract', hostvars, 'keepalived_priority') | list }}
  ansible.builtin.assert:
    that:
      - priorities | length == priorities | unique | length
    fail_msg: >-
      Приоритеты keepalived не уникальны: {{ priorities }}.
      Одинаковые приоритеты дают неопределённый выбор master.
    quiet: true
  when:
    - api_vip_managed | bool
    - preflight_keepalived_enabled | bool
  run_once: true
