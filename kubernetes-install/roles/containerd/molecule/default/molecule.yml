---
# Требует доступа к внутреннему artifact storage. В CI адрес задаётся
# переменной MOLECULE_ARTIFACTS_HOST.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-containerd-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    # containerd требует привилегий: он монтирует overlayfs и управляет
    # cgroup. Без privileged сервис не стартует.
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs: [/run, /tmp]
    groups: [kubernetes, control_plane]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../../../molecule-shared/group_vars
    host_vars:
      molecule-containerd-01:
        node_ip: 10.99.0.21
    group_vars:
      all:
        # Pull тестового образа требует доступа к Harbor и рабочих зеркал.
        # Включать в CI, где такой доступ есть.
        containerd_verify_pull: false

verifier:
  name: ansible
