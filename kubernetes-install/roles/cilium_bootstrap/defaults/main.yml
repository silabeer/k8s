---
cilium_namespace: kube-system
cilium_release_name: cilium

# Единый источник values — GitOps-репозиторий (раздел 4.3). Собственного
# шаблона values у Ansible нет и быть не должно: иначе bootstrap и Argo CD
# разъедутся, и takeover покажет диффы в spec.
cilium_values_relative_path: "values/cilium.yaml"

cilium_checkout_dir: /tmp/gitops-checkout
cilium_manifest_path: /etc/kubernetes/bootstrap/cilium-rendered.yaml
# ConfigMap применяется отдельным шагом и раньше остального манифеста —
# см. пояснение в tasks/render_apply.yml.
cilium_configmap_manifest_path: /etc/kubernetes/bootstrap/cilium-configmap.yaml

# Каталог CRD Gateway API в GitOps-репозитории. Их применяет и эта роль
# (до чарта), и Argo CD — из одного и того же места.
cilium_gateway_api_crds_path: infrastructure/gateway-api-crds

# Argo CD Application, забирающая Cilium под управление (wave -10).
# Её наличие в статусе Synced означает, что роль больше не должна
# применять манифесты (раздел 24).
cilium_argocd_application: cilium
cilium_argocd_namespace: "{{ argocd.namespace }}"

# Bootstrap применяет манифесты тем же field manager, которым потом работает
# Argo CD. Тогда takeover через Server-Side Apply не порождает конфликтов
# владения полями.
cilium_field_manager: "{{ argocd.field_manager }}"

cilium_status_retries: 40
cilium_status_delay: 15

# Ожидание перезапуска после изменения cilium-config. Агент при старте ждёт
# нужные ему CRD до пяти минут и только затем завершается с fatal, поэтому
# таймаут заведомо больше: иначе роль сдастся раньше, чем станет ясен исход.
cilium_rollout_timeout: "10m"

# Ключ GitOps deploy key в секрет-бэкенде
cilium_deploy_key_secret_key: gitops-deploy-key

# Общий центр сертификации Cluster Mesh (ADR 0002). Поля необязательны:
# без них каждый кластер получает собственный CA, что годится для
# одиночного кластера, но не для mesh.
cilium_ca_secret_name: cilium-ca
cilium_ca_cert_secret_key: cilium-ca-cert
cilium_ca_key_secret_key: cilium-ca-key

# Способ доступа к GitOps-репозиторию определяется по самому URL.
#
# ssh://... или git@... — нужен деплой-ключ (production-схема раздела 18.2).
# https://...           — ключ не нужен: для публичного репозитория доступ
#                         анонимный, и требовать приватный ключ бессмысленно.
gitops_url_is_ssh: "{{ gitops.repo_url is match('^(ssh://|git@)') }}"
