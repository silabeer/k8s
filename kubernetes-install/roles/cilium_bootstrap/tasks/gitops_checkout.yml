---
# Values берутся из GitOps-репозитория без модификаций (раздел 4.3).
#
# Работа с ключом нужна только для доступа по SSH. Для публичного
# репозитория по HTTPS ключа нет и быть не должно.

- name: Prepare SSH access to the GitOps repository
  when: gitops_url_is_ssh | bool
  block:
    - name: Resolve the GitOps deploy key
      ansible.builtin.import_tasks: resolve_secrets.yml

    - name: Create a directory for the deploy key
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the deploy key
      ansible.builtin.copy:
        content: "{{ gitops_deploy_key }}\n"
        dest: /root/.ssh/gitops_deploy_key
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Add the Git host to known_hosts
      ansible.builtin.known_hosts:
        path: /root/.ssh/known_hosts
        name: "{{ gitops.ssh_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -p ' ~ gitops.ssh_port ~ ' ' ~ gitops.ssh_host) }}"
        state: present

- name: Clone the GitOps repository
  ansible.builtin.git:
    repo: "{{ gitops.repo_url }}"
    dest: "{{ cilium_checkout_dir }}"
    version: "{{ gitops.revision }}"
    depth: 1
    single_branch: true
    accept_hostkey: false
    key_file: "{{ '/root/.ssh/gitops_deploy_key' if gitops_url_is_ssh | bool else omit }}"
  register: cilium_gitops_clone

- name: Assert the Cilium values file exists in the repository
  ansible.builtin.stat:
    path: "{{ cilium_checkout_dir }}/{{ gitops.cluster_path }}/{{ cilium_values_relative_path }}"
  register: cilium_values_stat
  failed_when: not cilium_values_stat.stat.exists

- name: Record the values file path and revision
  ansible.builtin.set_fact:
    cilium_values_path: "{{ cilium_checkout_dir }}/{{ gitops.cluster_path }}/{{ cilium_values_relative_path }}"
    cilium_values_revision: "{{ cilium_gitops_clone.after | default('unknown') }}"

# =============================================================================
# Согласованность values с адресом кластера
#
# k8sServiceHost задаёт адрес apiserver, по которому агенты Cilium ходят при
# kubeProxyReplacement. Он живёт в GitOps-репозитории, а адрес кластера — в
# инвентаре Ansible, и связи между ними нет никакой.
#
# Наблюдалось вживую: values достались от прежнего стенда, и агенты 11 минут
# стучались в адрес погашенной машины. Диагностика обманчива — образ
# скачался, под создан, kubectl logs не работает (serving-сертификат kubelet
# ещё не подписан), а в событиях только BackOff без причины.
# =============================================================================
- name: Read the Cilium values
  ansible.builtin.slurp:
    src: "{{ cilium_values_path }}"
  register: cilium_values_content

- name: Assert the API address in values matches this cluster
  ansible.builtin.assert:
    that:
      - cilium_values_parsed.k8sServiceHost | default(cilium_expected_api_host)
        == cilium_expected_api_host
    # default() обязателен и в САМОМ СООБЩЕНИИ: Ansible рендерит fail_msg
    # до вычисления условия, поэтому ссылка на отсутствующий ключ роняет
    # проверку там, где она должна была просто пройти. Ключа нет всегда,
    # когда kubeProxyReplacement не используется. Ровно на этом уже
    # обжигались в дефекте 31.
    fail_msg: >-
      В values задан
      k8sServiceHost={{ cilium_values_parsed.k8sServiceHost | default('не задан') }},
      а apiserver этого кластера — {{ cilium_expected_api_host }}. С чужим
      адресом агенты Cilium не поднимутся: они будут ждать ответа от машины,
      которой в этом контуре нет.
    quiet: true
  vars:
    cilium_values_parsed: "{{ cilium_values_content.content | b64decode | from_yaml }}"
    cilium_expected_api_host: "{{ api_vip | default(control_plane_endpoint_host) }}"
