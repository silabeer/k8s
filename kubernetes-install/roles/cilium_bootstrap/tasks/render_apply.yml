---
# =============================================================================
# Форма вызова helm template (B3)
#
# Две формы указания чарта ВЗАИМОИСКЛЮЧАЮЩИЕ:
#   OCI:  helm template cilium oci://harbor/charts/cilium --version X
#   repo: helm template cilium cilium --repo https://helm.cilium.io/ --version X
#
# Смешивание — `helm template cilium cilium/cilium --repo <url>` — ошибка:
# с --repo имя чарта указывается БЕЗ префикса репозитория, иначе helm ищет
# чарт `cilium/cilium` внутри указанного репозитория и не находит.
#
# Команда собирается здесь в единственном месте, поэтому разъехаться формы
# не могут.
# =============================================================================

- name: Build the chart reference
  ansible.builtin.set_fact:
    cilium_chart_ref: >-
      {{ cni.chart_oci if cni.chart_source == 'oci' else cni.chart_name }}
    cilium_repo_args: >-
      {{ [] if cni.chart_source == 'oci' else ['--repo', cni.chart_repo] }}

- name: Assert the chart source is known
  ansible.builtin.assert:
    that:
      - cni.chart_source in ['oci', 'repo']
    fail_msg: "cni.chart_source должен быть oci или repo, получено: {{ cni.chart_source }}"
    quiet: true

- name: Create the bootstrap manifest directory
  ansible.builtin.file:
    path: "{{ cilium_manifest_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# helm template, а не helm install (раздел 4.3): в кластере не создаётся
# helm release secret sh.helm.release.v1.*, поэтому после takeover не
# остаётся осиротевшего релиза, который Argo CD не видит и не чистит.
- name: Render the Cilium chart
  ansible.builtin.command:
    argv: >-
      {{ ['helm', 'template', cilium_release_name, cilium_chart_ref]
         + cilium_repo_args
         + ['--version', cni.version,
            '--namespace', cilium_namespace,
            '--values', cilium_values_path] }}
  register: cilium_rendered
  changed_when: false

- name: Write the rendered manifest
  ansible.builtin.copy:
    content: "{{ cilium_rendered.stdout }}"
    dest: "{{ cilium_manifest_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Assert the rendered manifest is not empty
  ansible.builtin.assert:
    that:
      - cilium_rendered.stdout | length > 1000
      - cilium_rendered.stdout is search('kind:\s*DaemonSet')
    fail_msg: >-
      Рендер чарта Cilium не дал DaemonSet. Проверьте values в
      {{ cilium_values_path }} и версию чарта {{ cni.version }}.
    quiet: true

# =============================================================================
# CRD Gateway API ставятся ДО применения чарта
#
# При gatewayAPI.gatewayClass.create=true чарт рендерит объект
# GatewayClass. Он относится к API gateway.networking.k8s.io, которого в
# чистом кластере нет: этап 50 идёт задолго до Argo CD, и поставить CRD
# больше некому. kubectl отвечает «no matches for kind GatewayClass», и
# падает применение ВСЕГО манифеста, то есть установка кластера.
#
# Признак берётся из самого отрендеренного манифеста, а не из отдельной
# переменной: values — единственный источник правды, и вводить второй
# означало бы, что когда-нибудь они разойдутся.
# =============================================================================
- name: Determine whether the manifest needs Gateway API CRDs
  ansible.builtin.set_fact:
    cilium_needs_gateway_api_crds: >-
      {{ cilium_rendered.stdout is search('gateway\.networking\.k8s\.io') }}

- name: Install the Gateway API CRDs
  when: cilium_needs_gateway_api_crds | bool
  block:
    - name: Check the CRDs are present in the GitOps repository
      ansible.builtin.stat:
        path: "{{ cilium_checkout_dir }}/{{ cilium_gateway_api_crds_path }}/kustomization.yaml"
      register: cilium_gateway_api_crds_stat

    - name: Assert the CRDs are available
      ansible.builtin.assert:
        that:
          - cilium_gateway_api_crds_stat.stat.exists
        fail_msg: >-
          Values включают Gateway API, но в GitOps-репозитории нет
          {{ cilium_gateway_api_crds_path }}. CRD должны лежать там же,
          откуда их берёт Argo CD: этап 50 применяет их раньше, чем Argo CD
          существует, и второй источник неминуемо разошёлся бы с первым.
        quiet: true

    - name: Apply the Gateway API CRDs
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --server-side
          - --force-conflicts
          - --field-manager={{ cilium_field_manager }}
          - -k
          - "{{ cilium_checkout_dir }}/{{ cilium_gateway_api_crds_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: cilium_gateway_api_crds_apply
      # kubectl apply --server-side печатает «serverside-applied»
      # независимо от того, изменилось что-нибудь или нет; слов
      # created/configured в его выводе не бывает. Любое условие по
      # выводу здесь либо всегда ложно, либо всегда истинно, поэтому
      # признак изменения берётся не отсюда, а из явных сравнений ниже:
      # данные ConfigMap и поколение DaemonSet.
      changed_when: false

    - name: Wait for the CRDs to be established
      # Между применением и готовностью CRD есть окно: apiserver ещё не
      # обслуживает новый тип, и следующий apply падает так же, как если
      # бы CRD не было вовсе.
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Established
          - --timeout=120s
          - crd/gatewayclasses.gateway.networking.k8s.io
          - crd/gateways.gateway.networking.k8s.io
          - crd/httproutes.gateway.networking.k8s.io
          - crd/tlsroutes.gateway.networking.k8s.io
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

# =============================================================================
# ConfigMap применяется ОТДЕЛЬНО и ПЕРВЫМ
#
# Часть ключей cilium-config определяет, какие CRD регистрирует оператор
# (так ведёт себя Gateway API). Агент, стартовавший раньше, ждёт их пять
# минут и завершается с level=fatal.
#
# Одним манифестом правильный порядок недостижим. При rollOutCiliumPods
# чарт проставляет DaemonSet контрольную сумму конфигурации, поэтому
# агенты начинают перекатываться СРАЗУ на apply; у Deployment оператора
# такой отметки нет, пока не задан operator.rollOutPods, — и он остаётся
# работать со старой конфигурацией. Наблюдалось вживую: ready=1/3, уцелел
# ровно тот узел, где под агента не трогали.
#
# Поэтому порядок разнесён по шагам: ConfigMap → оператор → всё остальное.
# =============================================================================
- name: Render the Cilium ConfigMap alone
  ansible.builtin.command:
    argv: >-
      {{ ['helm', 'template', cilium_release_name, cilium_chart_ref]
         + cilium_repo_args
         + ['--version', cni.version,
            '--namespace', cilium_namespace,
            '--values', cilium_values_path,
            '--show-only', 'templates/cilium-configmap.yaml'] }}
  register: cilium_configmap_rendered
  changed_when: false

- name: Write the rendered ConfigMap
  ansible.builtin.copy:
    content: "{{ cilium_configmap_rendered.stdout }}"
    dest: "{{ cilium_configmap_manifest_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Read the live configuration before applying
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: ConfigMap
    namespace: "{{ cilium_namespace }}"
    name: cilium-config
  register: cilium_config_before

- name: Apply the ConfigMap
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --server-side
      - --force-conflicts
      - --field-manager={{ cilium_field_manager }}
      - -f
      - "{{ cilium_configmap_manifest_path }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cilium_configmap_apply
  # kubectl apply --server-side печатает «serverside-applied»
  # независимо от того, изменилось что-нибудь или нет; слов
  # created/configured в его выводе не бывает. Любое условие по
  # выводу здесь либо всегда ложно, либо всегда истинно, поэтому
  # признак изменения берётся не отсюда, а из явных сравнений ниже:
  # данные ConfigMap и поколение DaemonSet.
  changed_when: false

- name: Read the live configuration after applying
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: ConfigMap
    namespace: "{{ cilium_namespace }}"
    name: cilium-config
  register: cilium_config_after

- name: Determine whether the configuration changed
  ansible.builtin.set_fact:
    # Первичная установка сюда не попадает: до неё ConfigMap не
    # существует, и перезапускать нечего — поды создаются заново.
    cilium_config_changed: >-
      {{ (cilium_config_before.resources | length > 0)
         and (cilium_config_before.resources[0].data | default({}))
             != (cilium_config_after.resources[0].data | default({})) }}

- name: Restart the operator before the rest of the manifest
  when: cilium_config_changed | bool
  block:
    - name: Report the changed keys
      ansible.builtin.debug:
        msg: >-
          cilium-config изменён — оператор перезапускается ДО применения
          остального манифеста. Затронутые ключи:
          {{ ((cilium_config_before.resources[0].data | default({}) | dict2items)
              | symmetric_difference(
                  cilium_config_after.resources[0].data | default({}) | dict2items))
             | map(attribute='key') | unique | sort | join(', ') }}

    - name: Restart the operator
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ cilium_namespace }}", rollout, restart, deployment/cilium-operator]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Wait for the operator to finish rolling out
      # Именно ожидание готовности, а не пауза: агенты не должны
      # стартовать раньше, чем оператор зарегистрирует CRD.
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ cilium_namespace }}"
          - rollout
          - status
          - deployment/cilium-operator
          - --timeout={{ cilium_rollout_timeout }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

- name: Read the DaemonSet generation before applying
  # Нужно, чтобы отличить два случая: чарт сам перекатил агентов по
  # контрольной сумме (rollOutCiliumPods) или не перекатил вовсе — тогда
  # новая конфигурация не подействует, пока агенты не перезапустить.
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: DaemonSet
    namespace: "{{ cilium_namespace }}"
    name: cilium
  register: cilium_ds_before

# Server-Side Apply тем же field manager, которым потом работает Argo CD:
# при takeover владение полями переходит без конфликтов.
- name: Apply the Cilium manifest
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --server-side
      - --force-conflicts
      - --field-manager={{ cilium_field_manager }}
      - -f
      - "{{ cilium_manifest_path }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cilium_apply
  # kubectl apply --server-side печатает «serverside-applied»
  # независимо от того, изменилось что-нибудь или нет; слов
  # created/configured в его выводе не бывает. Любое условие по
  # выводу здесь либо всегда ложно, либо всегда истинно, поэтому
  # признак изменения берётся не отсюда, а из явных сравнений ниже:
  # данные ConfigMap и поколение DaemonSet.
  changed_when: false

# =============================================================================
# Агенты
#
# Если чарт проставляет DaemonSet контрольную сумму конфигурации
# (rollOutCiliumPods), apply выше уже начал перекат — тогда достаточно
# дождаться его окончания. Если отметки нет, шаблон пода не изменился,
# перекат не начнётся сам, и новая конфигурация не подействует: агент
# читает cilium-config только при старте.
# =============================================================================
- name: Roll out the agents after a configuration change
  when: cilium_config_changed | bool
  block:
    - name: Read the DaemonSet generation after applying
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: DaemonSet
        namespace: "{{ cilium_namespace }}"
        name: cilium
      register: cilium_ds_after

    - name: Restart the agents if the manifest did not do it
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ cilium_namespace }}", rollout, restart, daemonset/cilium]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when:
        - cilium_ds_before.resources | length > 0
        - (cilium_ds_after.resources[0].metadata.generation | default(0))
          == (cilium_ds_before.resources[0].metadata.generation | default(-1))
      changed_when: true

    - name: Wait for the agents to finish rolling out
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ cilium_namespace }}"
          - rollout
          - status
          - daemonset/cilium
          - --timeout={{ cilium_rollout_timeout }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

- name: Assert no helm release secret was created
  # Контроль того, что установка действительно шла через helm template:
  # helm install оставил бы sh.helm.release.v1.cilium.*, и Argo CD после
  # takeover не смог бы им управлять.
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Secret
    namespace: "{{ cilium_namespace }}"
    label_selectors:
      - "owner=helm"
      - "name={{ cilium_release_name }}"
  register: cilium_helm_secrets
  failed_when: cilium_helm_secrets.resources | length > 0

- name: Record the applied revision
  ansible.builtin.debug:
    msg: >-
      Cilium {{ cni.version }} применён из
      {{ gitops.cluster_path }}/{{ cilium_values_relative_path }}
      (ревизия {{ cilium_values_revision }}), field manager
      {{ cilium_field_manager }}.
