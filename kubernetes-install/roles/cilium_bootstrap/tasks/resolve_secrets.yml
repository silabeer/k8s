---
# Единая точка разрешения секретов (раздел 3.2 spec).

- name: Read the deploy key from OpenBao
  ansible.builtin.set_fact:
    gitops_deploy_key: >-
      {{ lookup('community.hashi_vault.hashi_vault',
                openbao_mount_point ~ '/data/' ~ openbao_cluster_path,
                url=openbao_url) [cilium_deploy_key_secret_key] }}
  when: secret_backend == 'openbao'
  no_log: true

- name: Read the deploy key from the ansible-vault file
  when: secret_backend == 'vault_file'
  no_log: true
  block:
    - name: Load vault file
      ansible.builtin.include_vars:
        file: "{{ vault_file_path }}"
        name: cilium_vault_secrets

    - name: Extract the deploy key
      ansible.builtin.set_fact:
        gitops_deploy_key: "{{ cilium_vault_secrets[cilium_deploy_key_secret_key] }}"

- name: Assert the deploy key was resolved
  ansible.builtin.assert:
    that:
      - gitops_deploy_key is defined
      - gitops_deploy_key is search('BEGIN [A-Z ]*PRIVATE KEY')
    fail_msg: >-
      Deploy key для GitOps-репозитория не получен из {{ secret_backend }}
      либо не является приватным ключом.
    quiet: true
  no_log: true
