---
kubeadm_config_dir: /etc/kubernetes
kubeadm_init_config_path: /etc/kubernetes/kubeadm-init.yaml
kubeadm_join_config_path: /etc/kubernetes/kubeadm-join.yaml
kubeadm_encryption_config_path: /etc/kubernetes/encryption-config.yaml
kubeadm_audit_policy_path: /etc/kubernetes/audit-policy.yaml
kubeadm_admission_config_path: /etc/kubernetes/admission-config.yaml

# Имя ключа шифрования. Значение НЕ косметическое: apiserver подбирает ключ
# расшифровки по имени из префикса записи в etcd (k8s:enc:secretbox:v1:<имя>).
# Имя, разошедшееся с тем, под которым данные записаны, даёт отказ
# «no matching key was found for the provided Secretbox transformer» —
# все Secrets становятся нечитаемыми.
#
# Поэтому после ротации имя обязано следовать за ключом: playbook ротации
# чередует key1 <-> key2, а фактическое имя хранится в секрет-бэкенде рядом
# с самим ключом (поле ниже) и подхватывается отсюда лишь как значение
# по умолчанию для кластера, который ещё не ротировали.
etcd_encryption_key_name: key1
kubeadm_encryption_keys: ~ # вычисляется в encryption_config.yml

# Ключи секретов в бэкенде
kubeadm_etcd_encryption_secret_key: etcd-encryption-key
# Необязательное поле: имя действующего ключа. Появляется после первой
# ротации; пока его нет, действует etcd_encryption_key_name.
kubeadm_etcd_encryption_key_name_secret_key: etcd-encryption-key-name

# etcd принимает версию TLS в формате TLS1.2/TLS1.3, apiserver — VersionTLS12.
etcd_tls_min_version: TLS1.2

# Ротация логов контейнеров на стороне kubelet
kubelet_container_log_max_size: "50Mi"
kubelet_container_log_max_files: 5

# =============================================================================
# Два параметра ниже вынесены в переменные ради возможности тестировать роль
# в контейнере. В production оба обязаны оставаться в значениях по умолчанию;
# сейчас их никто не переключает — контейнерных сценариев в проекте нет.
#
# protectKernelDefaults: kubelet читает /proc/sys/kernel/*, а эти параметры
# не изолируются сетевым или PID namespace — внутри контейнера видны значения
# ХОСТА. Docker не позволяет задать их через `sysctls` (в whitelist только
# net.*, fs.mqueue.* и часть kernel.{sem,shm,msg}). Поэтому контейнерный
# сценарий может включить protectKernelDefaults, лишь если нужные значения
# выставлены на самом хосте.
kubelet_protect_kernel_defaults: true

# failSwapOn: /proc/swaps внутри контейнера показывает swap хоста, а `swapoff`
# из privileged-контейнера отключил бы swap на хосте. Поэтому в контейнере
# swap не трогается, а kubelet его игнорирует.
kubelet_fail_swap_on: true
# =============================================================================

kubeadm_config_validate: true

# Путь к CRI-сокету. Дублируется здесь намеренно: defaults роли containerd
# в этой роли не видны, а шаблоны на него ссылаются. Роль обязана оставаться
# самодостаточной; значение из inventory переопределяет
# defaults и держит оба места в согласии.
containerd_socket: /run/containerd/containerd.sock
