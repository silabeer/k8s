---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # ---------------------------------------------------------------------
    # Шифрование Secrets
    # ---------------------------------------------------------------------
    - name: Stat the encryption configuration
      ansible.builtin.stat:
        path: /etc/kubernetes/encryption-config.yaml
      register: enc_stat

    - name: Assert the encryption configuration is root-only
      ansible.builtin.assert:
        that:
          - enc_stat.stat.exists
          - enc_stat.stat.mode == '0600'
          - enc_stat.stat.pw_name == 'root'
        fail_msg: >-
          encryption-config должен быть 0600 и принадлежать root: он содержит
          ключ, которым расшифровываются все Secrets кластера.
        quiet: true

    - name: Read the encryption configuration
      ansible.builtin.slurp:
        src: /etc/kubernetes/encryption-config.yaml
      register: enc_content

    - name: Parse the encryption configuration
      ansible.builtin.set_fact:
        enc_config: "{{ enc_content.content | b64decode | from_yaml }}"

    - name: Assert the encryption configuration is well-formed
      ansible.builtin.assert:
        that:
          - enc_config.kind == 'EncryptionConfiguration'
          - enc_config.resources[0].resources == ['secrets']
          # secretbox первым, identity последним: identity в конце нужен,
          # чтобы читались Secrets, записанные до включения шифрования.
          - enc_config.resources[0].providers[0].secretbox is defined
          - enc_config.resources[0].providers[-1].identity is defined
        fail_msg: "Структура encryption-config неверна."
        quiet: true

    - name: Assert aescbc is not used
      ansible.builtin.assert:
        that:
          - enc_config.resources[0].providers[0].aescbc is not defined
        fail_msg: >-
          Выбран провайдер aescbc. CBC уязвим к padding oracle; дефолт
          проекта — secretbox (S5).
        quiet: true

    # ---------------------------------------------------------------------
    # Аудит
    # ---------------------------------------------------------------------
    - name: Read the audit policy
      ansible.builtin.slurp:
        src: /etc/kubernetes/audit-policy.yaml
      register: audit_content

    - name: Parse the audit policy
      ansible.builtin.set_fact:
        audit_policy: "{{ audit_content.content | b64decode | from_yaml }}"

    - name: Assert the audit policy is well-formed
      ansible.builtin.assert:
        that:
          - audit_policy.kind == 'Policy'
          - audit_policy.rules | length > 0
          # Последнее правило универсальное — иначе часть событий не логируется
          - audit_policy.rules[-1].level == 'Metadata'
          - audit_policy.rules[-1].resources is not defined
        fail_msg: "Структура audit-policy неверна."
        quiet: true

    - name: Assert secrets are audited at metadata level only
      vars:
        secret_rules: >-
          {{ audit_policy.rules
             | selectattr('resources', 'defined')
             | selectattr('level', 'equalto', 'Metadata') | list }}
      ansible.builtin.assert:
        that:
          - secret_rules | length > 0
        fail_msg: >-
          Нет правила уровня Metadata для secrets — тела секретов попадут
          в audit log открытым текстом.
        quiet: true

    # ---------------------------------------------------------------------
    # Pod Security Admission
    # ---------------------------------------------------------------------
    - name: Read the admission configuration
      ansible.builtin.slurp:
        src: /etc/kubernetes/admission-config.yaml
      register: admission_content

    - name: Parse the admission configuration
      ansible.builtin.set_fact:
        admission_config: "{{ admission_content.content | b64decode | from_yaml }}"

    - name: Assert Pod Security Admission is configured
      vars:
        psa: >-
          {{ admission_config.plugins
             | selectattr('name', 'equalto', 'PodSecurity') | first }}
      ansible.builtin.assert:
        that:
          - admission_config.kind == 'AdmissionConfiguration'
          - psa.configuration.kind == 'PodSecurityConfiguration'
          - psa.configuration.defaults.enforce == pod_security_admission_enforce
          - "'kube-system' in psa.configuration.exemptions.namespaces"
        fail_msg: >-
          PSA настроен неверно. Без него между kubeadm init и установкой
          policy engine (wave 0) кластер ничем не защищён (S15).
        quiet: true

    # ---------------------------------------------------------------------
    # kubeadm InitConfiguration
    # ---------------------------------------------------------------------
    - name: Validate the kubeadm configuration
      ansible.builtin.command:
        cmd: kubeadm config validate --config /etc/kubernetes/kubeadm-init.yaml
      changed_when: false

    - name: Read the kubeadm configuration
      ansible.builtin.slurp:
        src: /etc/kubernetes/kubeadm-init.yaml
      register: kubeadm_content

    - name: Split the kubeadm configuration into documents
      ansible.builtin.set_fact:
        kubeadm_docs: >-
          {{ (kubeadm_content.content | b64decode).split('---')
             | reject('match', '^\s*$') | map('from_yaml') | list }}

    - name: Extract ClusterConfiguration and KubeletConfiguration
      ansible.builtin.set_fact:
        cluster_config: >-
          {{ kubeadm_docs | selectattr('kind', 'equalto', 'ClusterConfiguration') | first }}
        kubelet_config: >-
          {{ kubeadm_docs | selectattr('kind', 'equalto', 'KubeletConfiguration') | first }}

    - name: Assert the API endpoint is the VIP hostname, not a node address
      ansible.builtin.assert:
        that:
          - cluster_config.controlPlaneEndpoint == control_plane_endpoint
          - cluster_config.controlPlaneEndpoint is not match('^\d+\.\d+\.\d+\.\d+:')
        fail_msg: >-
          controlPlaneEndpoint указывает на IP. Он зашивается в kubeconfig
          всех компонентов и меняется только пересозданием кластера
          (раздел 3.2).
        quiet: true

    - name: Assert apiserver security flags are present
      vars:
        arg_names: "{{ cluster_config.apiServer.extraArgs | map(attribute='name') | list }}"
      ansible.builtin.assert:
        that:
          - "'encryption-provider-config' in arg_names"
          - "'audit-policy-file' in arg_names"
          - "'audit-log-path' in arg_names"
          - "'admission-control-config-file' in arg_names"
          - "'tls-min-version' in arg_names"
          - "'tls-cipher-suites' in arg_names"
        fail_msg: "В apiServer.extraArgs не хватает флагов: {{ arg_names }}"
        quiet: true

    - name: Assert extraArgs use the v1beta4 list form
      ansible.builtin.assert:
        that:
          - cluster_config.apiServer.extraArgs is iterable
          - cluster_config.apiServer.extraArgs is not mapping
          - cluster_config.apiServer.extraArgs[0].name is defined
          - cluster_config.apiServer.extraArgs[0].value is defined
        fail_msg: >-
          extraArgs оформлены как словарь — это схема v1beta3.
          В v1beta4 это список объектов {name, value}.
        quiet: true

    - name: Assert every extraVolume has a matching mount
      vars:
        volumes: "{{ cluster_config.apiServer.extraVolumes | map(attribute='name') | list }}"
      ansible.builtin.assert:
        that:
          - "'encryption-config' in volumes"
          - "'audit-policy' in volumes"
          - "'audit-log' in volumes"
          - "'admission-config' in volumes"
        fail_msg: >-
          Не все конфигурации примонтированы в apiserver: {{ volumes }}.
          Флаг без соответствующего volume приводит к CrashLoopBackOff.
        quiet: true

    - name: Assert kubelet configuration matches the design
      ansible.builtin.assert:
        that:
          - kubelet_config.cgroupDriver == 'systemd'
          - kubelet_config.protectKernelDefaults | bool
          - kubelet_config.rotateCertificates | bool
          - kubelet_config.serverTLSBootstrap | bool
        fail_msg: "KubeletConfiguration не соответствует требованиям раздела 14.2."
        quiet: true

    - name: Assert evictionHard keeps the inode threshold
      ansible.builtin.assert:
        that:
          - kubelet_config.evictionHard['nodefs.inodesFree'] is defined
        fail_msg: >-
          В evictionHard отсутствует nodefs.inodesFree. Карта заменяет
          дефолты целиком, поэтому исчерпание inode перестанет вытеснять
          Pod'ы (S11).
        quiet: true
