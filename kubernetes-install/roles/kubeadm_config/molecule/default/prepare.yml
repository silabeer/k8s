---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Bootstrap python
      ansible.builtin.raw: |
        set -e
        apt-get update -qq
        apt-get install -y -qq python3 ca-certificates curl gnupg
      changed_when: true

    - name: Gather facts after bootstrap
      ansible.builtin.setup:

    # kubeadm нужен для `kubeadm config validate` — без него проверка схемы
    # v1beta4 не состоится, а она и есть смысл сценария.
    - name: Install Kubernetes packages
      ansible.builtin.include_role:
        name: kubernetes_packages
      vars:
        kubernetes_packages_install_helm: false
