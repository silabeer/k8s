---
# Единая точка разрешения секретов (раздел 3.2 spec). Роли остаются
# самодостаточными, чтобы molecule мог тестировать их в изоляции.
#
# Ключ шифрования генерируется один раз (head -c 32 /dev/urandom | base64),
# хранится в OpenBao, не попадает ни в Git, ни в логи.

- name: Read secrets from OpenBao
  when: secret_backend == 'openbao'
  no_log: true
  block:
    - name: Fetch cluster secrets
      ansible.builtin.set_fact:
        kubeadm_secrets: >-
          {{ lookup('community.hashi_vault.hashi_vault',
                    openbao_mount_point ~ '/data/' ~ openbao_cluster_path,
                    url=openbao_url) }}

    - name: Extract etcd encryption key
      ansible.builtin.set_fact:
        etcd_encryption_key: "{{ kubeadm_secrets[kubeadm_etcd_encryption_secret_key] }}"

    - name: Extract next etcd encryption key when present
      ansible.builtin.set_fact:
        etcd_encryption_key_next: "{{ kubeadm_secrets[kubeadm_etcd_encryption_secret_key ~ '-next'] }}"
      when: (kubeadm_etcd_encryption_secret_key ~ '-next') in kubeadm_secrets

- name: Read secrets from ansible-vault file
  when: secret_backend == 'vault_file'
  no_log: true
  block:
    - name: Load vault file
      ansible.builtin.include_vars:
        file: "{{ vault_file_path }}"
        name: kubeadm_vault_secrets

    - name: Extract etcd encryption key
      ansible.builtin.set_fact:
        etcd_encryption_key: "{{ kubeadm_vault_secrets[kubeadm_etcd_encryption_secret_key] }}"

    - name: Extract next etcd encryption key when present
      ansible.builtin.set_fact:
        etcd_encryption_key_next: "{{ kubeadm_vault_secrets[kubeadm_etcd_encryption_secret_key ~ '-next'] }}"
      when: (kubeadm_etcd_encryption_secret_key ~ '-next') in kubeadm_vault_secrets

- name: Assert the encryption key was resolved
  ansible.builtin.assert:
    that:
      - etcd_encryption_key is defined
      - etcd_encryption_key | length > 0
      # 32 байта в base64 — 44 символа с паддингом. Ключ другой длины
      # apiserver отвергнет при старте, и причина будет видна только в логах
      # static pod.
      - (etcd_encryption_key | b64decode | length) == 32
    fail_msg: >-
      Ключ шифрования etcd не получен из {{ secret_backend }} либо имеет
      неверную длину. Требуется 32 байта в base64:
      head -c 32 /dev/urandom | base64
    quiet: true
  when: etcd_encryption_provider != 'kms'
  no_log: true
