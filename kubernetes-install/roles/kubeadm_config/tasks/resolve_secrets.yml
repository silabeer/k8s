---
# Единая точка разрешения секретов (раздел 3.2 spec). Роли остаются
# самодостаточными, чтобы molecule мог тестировать их в изоляции.
#
# Ключ шифрования генерируется один раз (head -c 32 /dev/urandom | base64),
# хранится в OpenBao, не попадает ни в Git, ни в логи.

- name: Read secrets from OpenBao
  when: secret_backend == 'openbao'
  no_log: true
  block:
    - name: Fetch cluster secrets
      ansible.builtin.set_fact:
        kubeadm_secrets: >-
          {{ lookup('community.hashi_vault.hashi_vault',
                    openbao_mount_point ~ '/data/' ~ openbao_cluster_path,
                    url=openbao_url) }}

    - name: Extract etcd encryption key
      ansible.builtin.set_fact:
        etcd_encryption_key: "{{ kubeadm_secrets[kubeadm_etcd_encryption_secret_key] }}"

    - name: Extract next etcd encryption key when present
      ansible.builtin.set_fact:
        etcd_encryption_key_next: "{{ kubeadm_secrets[kubeadm_etcd_encryption_secret_key ~ '-next'] }}"
      when: (kubeadm_etcd_encryption_secret_key ~ '-next') in kubeadm_secrets

    # Имя действующего ключа: после ротации оно уже не key1, а данные в etcd
    # подписаны именно им. Отсутствие поля означает «кластер не ротировали».
    - name: Extract the active key name when present
      ansible.builtin.set_fact:
        etcd_encryption_key_name: "{{ kubeadm_secrets[kubeadm_etcd_encryption_key_name_secret_key] }}"
      when: kubeadm_etcd_encryption_key_name_secret_key in kubeadm_secrets

- name: Read secrets from ansible-vault file
  when: secret_backend == 'vault_file'
  no_log: true
  block:
    - name: Load vault file
      ansible.builtin.include_vars:
        file: "{{ vault_file_path }}"
        name: kubeadm_vault_secrets

    - name: Extract etcd encryption key
      ansible.builtin.set_fact:
        etcd_encryption_key: "{{ kubeadm_vault_secrets[kubeadm_etcd_encryption_secret_key] }}"

    - name: Extract next etcd encryption key when present
      ansible.builtin.set_fact:
        etcd_encryption_key_next: "{{ kubeadm_vault_secrets[kubeadm_etcd_encryption_secret_key ~ '-next'] }}"
      when: (kubeadm_etcd_encryption_secret_key ~ '-next') in kubeadm_vault_secrets

    - name: Extract the active key name when present
      ansible.builtin.set_fact:
        etcd_encryption_key_name: "{{ kubeadm_vault_secrets[kubeadm_etcd_encryption_key_name_secret_key] }}"
      when: kubeadm_etcd_encryption_key_name_secret_key in kubeadm_vault_secrets

- name: Assert the encryption key was resolved
  # Проверяется база64-СТРОКА, а не результат её декодирования.
  #
  # `| b64decode | length` здесь не работает: фильтр возвращает текст, и
  # случайные байты ключа, не образующие корректный UTF-8, дают неверную
  # длину — на валидном 32-байтовом ключе наблюдалось 31. Проверка
  # отвергала бы правильные ключи.
  #
  # 32 байта кодируются ровно в 44 символа: 43 значащих плюс один символ
  # заполнения. Ключ другой длины apiserver отвергнет при старте, и причина
  # будет видна только в логах static pod.
  #
  # no_log здесь НЕ ставится: сообщение и текст условия ключа не содержат,
  # а без вывода причина отказа не диагностируется.
  ansible.builtin.assert:
    that:
      - etcd_encryption_key is defined
      - etcd_encryption_key | length == 44
      - etcd_encryption_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: >-
      Ключ шифрования etcd не получен из {{ secret_backend }} либо имеет
      неверный формат: требуется ровно 32 байта в base64, то есть 44 символа.
      Сгенерировать: head -c 32 /dev/urandom | base64
    quiet: true
  when: etcd_encryption_provider != 'kms'
