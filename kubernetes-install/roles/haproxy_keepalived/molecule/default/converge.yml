---
- name: Converge
  hosts: all
  become: true

  # Шаблон HAProxy строит backend по группе control_plane, которой в этом
  # сценарии нет. Подставляем её через add_host, чтобы проверить именно
  # рендер backend-пула.
  pre_tasks:
    - name: Register fake control-plane hosts for the backend pool
      ansible.builtin.add_host:
        name: "fake-cp-{{ item }}"
        groups: control_plane
        node_ip: "10.99.0.2{{ item }}"
      loop: [1, 2, 3]
      changed_when: false
      run_once: true

  tasks:
    - name: Apply the haproxy_keepalived role
      ansible.builtin.include_role:
        name: haproxy_keepalived
