---
# Уровень 1: рендер конфигурации, `haproxy -c -f` и синтаксис keepalived.
# Фактический подъём VIP и failover требуют NET_ADMIN и реального VRRP —
# это уровень 2.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-lb-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs: [/run, /tmp]
    groups: [load_balancers]

  - name: molecule-lb-02
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs: [/run, /tmp]
    groups: [load_balancers]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../../../molecule-shared/group_vars
    host_vars:
      molecule-lb-01:
        node_ip: 10.99.0.10
        keepalived_priority: 150
        keepalived_state: MASTER
      molecule-lb-02:
        node_ip: 10.99.0.11
        keepalived_priority: 100
        keepalived_state: BACKUP
    group_vars:
      all:
        api_vip_managed: true
        api_vip_interface: eth0
        haproxy_manage_services: false
        haproxy_package_version: "*"
        keepalived_package_version: "*"

verifier:
  name: ansible
