---
# Единая точка разрешения секретов (раздел 3.2 spec).
#
# Файл намеренно продублирован в ролях, которым нужны секреты: роль обязана
# оставаться самодостаточной и применимой отдельно от остального проекта,
# без остальных ролей проекта.

- name: Read secret from OpenBao
  ansible.builtin.set_fact:
    keepalived_auth_pass: >-
      {{ lookup('community.hashi_vault.hashi_vault',
                openbao_mount_point ~ '/data/' ~ openbao_cluster_path,
                url=openbao_url) [keepalived_auth_pass_secret_key] }}
  when: secret_backend == 'openbao'
  no_log: true

- name: Read secret from ansible-vault file
  when: secret_backend == 'vault_file'
  block:
    - name: Load vault file
      ansible.builtin.include_vars:
        file: "{{ vault_file_path }}"
        name: haproxy_vault_secrets
      no_log: true

    # default('') обязателен: без него отсутствующий ключ роняет задачу
    # изнутри, а no_log превращает отказ в «censored» без причины.
    # Отсутствие значения должен диагностировать assert ниже, а не KeyError.
    - name: Extract keepalived auth password
      ansible.builtin.set_fact:
        keepalived_auth_pass: >-
          {{ haproxy_vault_secrets[keepalived_auth_pass_secret_key] | default('') }}
      no_log: true

- name: Assert the VRRP password was resolved
  ansible.builtin.assert:
    that:
      - keepalived_auth_pass is defined
      - keepalived_auth_pass | length > 0
      # VRRP обрезает пароль до 8 символов — длинный даёт ложное ощущение
      # стойкости и расхождение между узлами при разной длине.
      - keepalived_auth_pass | length <= 8
    fail_msg: >-
      Пароль VRRP не получен из {{ secret_backend }}
      (поле {{ keepalived_auth_pass_secret_key }}) либо длиннее 8 символов.
      Протокол VRRP использует ровно 8 байт.
    quiet: true
  # no_log здесь НЕ ставится: ни условия, ни сообщение пароля не содержат,
  # а без вывода причина отказа не диагностируется. Тот же довод, что в
  # roles/kubeadm_config/tasks/resolve_secrets.yml.
