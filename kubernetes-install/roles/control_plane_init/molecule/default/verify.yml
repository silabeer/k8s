---
- name: Verify
  hosts: control_plane[0]
  become: true
  gather_facts: true

  tasks:
    - name: Re-run the precheck
      ansible.builtin.include_role:
        name: control_plane_init
        tasks_from: precheck

    - name: Assert the initialized cluster is recognised
      ansible.builtin.assert:
        that:
          - control_plane_init_already_done | bool
        fail_msg: >-
          Роль не распознала уже инициализированный кластер. Повторный прогон
          выполнил бы kubeadm init и создал новый кластер (раздел 24).
        quiet: true

    - name: Assert admin kubeconfig exists and is root-only
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf
      failed_when: >-
        not admin_conf.stat.exists or admin_conf.stat.mode != '0600'

    - name: Check readyz
      ansible.builtin.command:
        cmd: kubectl get --raw=/readyz
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: readyz
      changed_when: false
      failed_when: readyz.stdout | trim != 'ok'

    - name: List control plane static pods
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        kind: Pod
        namespace: kube-system
        label_selectors: ["tier=control-plane"]
      register: static_pods

    - name: Assert every control plane component is running
      vars:
        components: [kube-apiserver, kube-controller-manager, kube-scheduler, etcd]
        running: >-
          {{ static_pods.resources
             | selectattr('status.phase', 'equalto', 'Running')
             | map(attribute='metadata.labels.component') | list }}
      ansible.builtin.assert:
        that:
          - components | difference(running) | length == 0
        fail_msg: "Не запущены: {{ components | difference(running) }}"
        quiet: true

    # Ошибка в extraArgs приводит к тому, что apiserver молча стартует
    # без флагов безопасности, и Secrets лягут в etcd открытым текстом.
    - name: Read the apiserver manifest
      ansible.builtin.slurp:
        src: /etc/kubernetes/manifests/kube-apiserver.yaml
      register: apiserver_manifest

    - name: Assert security flags reached the running apiserver
      vars:
        manifest: "{{ apiserver_manifest.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - manifest is search('--encryption-provider-config=')
          - manifest is search('--audit-policy-file=')
          - manifest is search('--audit-log-path=')
          - manifest is search('--admission-control-config-file=')
          - manifest is search('--tls-min-version=')
        fail_msg: "В манифесте kube-apiserver не хватает флагов безопасности."
        quiet: true

    - name: Assert the audit log is being written
      ansible.builtin.stat:
        path: "{{ audit_log_dir }}/audit.log"
      register: audit_log
      failed_when: >-
        not audit_log.stat.exists or audit_log.stat.size == 0
