---
# kubeconfig с правами cluster-admin размещается только в защищённом месте
# (раздел 29.2). Ansible не копирует его на управляющую машину.

- name: Ensure kubeconfig permissions are restrictive
  ansible.builtin.file:
    path: "{{ control_plane_init_admin_conf }}"
    owner: root
    group: root
    mode: "0600"

- name: Create kubeconfig directory for the automation user
  ansible.builtin.file:
    path: "/home/{{ control_plane_init_user }}/.kube"
    state: directory
    owner: "{{ control_plane_init_user }}"
    group: "{{ control_plane_init_user }}"
    mode: "0700"
  when: control_plane_init_user_kubeconfig | bool

- name: Check for an existing user kubeconfig
  ansible.builtin.stat:
    path: "/home/{{ control_plane_init_user }}/.kube/config"
  register: control_plane_init_user_kubeconfig_stat
  when: control_plane_init_user_kubeconfig | bool

- name: Copy kubeconfig for the automation user
  # Существующий kubeconfig не перезаписывается (раздел 24): он мог быть
  # заменён на контекст с ограниченными правами.
  ansible.builtin.copy:
    src: "{{ control_plane_init_admin_conf }}"
    dest: "/home/{{ control_plane_init_user }}/.kube/config"
    remote_src: true
    owner: "{{ control_plane_init_user }}"
    group: "{{ control_plane_init_user }}"
    mode: "0600"
  when:
    - control_plane_init_user_kubeconfig | bool
    - not control_plane_init_user_kubeconfig_stat.stat.exists
