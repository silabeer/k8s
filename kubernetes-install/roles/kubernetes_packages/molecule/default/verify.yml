---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Get kubeadm version
      ansible.builtin.command:
        cmd: kubeadm version -o short
      register: kubeadm_ver
      changed_when: false

    - name: Get kubelet version
      ansible.builtin.command:
        cmd: kubelet --version
      register: kubelet_ver
      changed_when: false

    - name: Get kubectl version
      ansible.builtin.command:
        cmd: kubectl version --client -o yaml
      register: kubectl_ver
      changed_when: false

    - name: Get crictl version
      ansible.builtin.command:
        cmd: crictl --version
      register: crictl_ver
      changed_when: false

    - name: Assert the pinned version is installed everywhere
      ansible.builtin.assert:
        that:
          - kubeadm_ver.stdout is search(kubernetes_version | regex_escape)
          - kubelet_ver.stdout is search(kubernetes_version | regex_escape)
          - kubectl_ver.stdout is search(kubernetes_version | regex_escape)
        fail_msg: >-
          Установлены не те версии: kubeadm={{ kubeadm_ver.stdout }},
          kubelet={{ kubelet_ver.stdout }}. Ожидается {{ kubernetes_version }}.
        quiet: true

    - name: Assert crictl is installed
      ansible.builtin.assert:
        that:
          - crictl_ver.stdout | length > 0
        quiet: true

    # Без hold обычный unattended-upgrade поднимет minor-версию kubelet
    # и рассинхронизирует её с kubeadm (раздел 13).
    - name: Read held packages
      ansible.builtin.command:
        cmd: apt-mark showhold
      register: held
      changed_when: false

    - name: Assert every Kubernetes package is held
      ansible.builtin.assert:
        that:
          - item in held.stdout_lines
        fail_msg: "Пакет {{ item }} не защищён от автообновления."
        quiet: true
      loop:
        - kubelet
        - kubeadm
        - kubectl
        - cri-tools

    - name: Gather service facts
      ansible.builtin.service_facts:

    # kubelet намеренно enabled, но не running: до kubeadm init/join у него
    # нет конфигурации, и запуск даёт перезапуск в цикле.
    - name: Assert kubelet is enabled but not started
      ansible.builtin.assert:
        that:
          - ansible_facts.services['kubelet.service'].status == 'enabled'
        fail_msg: "kubelet должен быть enabled — его запускает kubeadm."
        quiet: true

    - name: Assert the apt repository is configured with a signed-by keyring
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/kubernetes.list
      register: apt_source

    - name: Assert the repository is signed
      ansible.builtin.assert:
        that:
          - (apt_source.content | b64decode) is search('signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg')
          - (apt_source.content | b64decode) is search(kubernetes_minor_version | regex_escape)
        fail_msg: "apt-репозиторий Kubernetes настроен без keyring или не на ту minor-версию."
        quiet: true
