---
- name: Read the current state
  ansible.builtin.command:
    cmd: bao status -format=json
  environment: "{{ openbao_cli_env }}"
  register: openbao_status
  changed_when: false
  # bao status возвращает 2, когда хранилище запечатано, и 1 — когда не
  # инициализировано. Оба состояния нормальны на этом шаге.
  failed_when: openbao_status.rc not in [0, 1, 2]

- name: Parse the current state
  ansible.builtin.set_fact:
    openbao_state: "{{ openbao_status.stdout | from_json }}"

- name: Report an already initialized store
  ansible.builtin.debug:
    msg: >-
      Хранилище уже инициализировано. Ключи распечатывания и корневой токен
      выдаются ОДИН РАЗ и повторно получены быть не могут — роль их не
      трогает.
  when: openbao_state.initialized | bool

- name: Initialize the store
  when:
    - openbao_initialize | bool
    - not (openbao_state.initialized | bool)
  block:
    - name: Run initialization
      ansible.builtin.command:
        cmd: >-
          bao operator init
          -key-shares={{ openbao_key_shares }}
          -key-threshold={{ openbao_key_threshold }}
          -format=json
      environment: "{{ openbao_cli_env }}"
      register: openbao_init
      changed_when: true
      no_log: true

    # Файл пишется на УПРАВЛЯЮЩУЮ машину, а не на сервер: держать ключи
    # распечатывания на том же узле, что и хранилище, равнозначно
    # незапечатанному хранилищу.
    - name: Save the initialization output on the controller
      ansible.builtin.copy:
        content: "{{ openbao_init.stdout }}"
        dest: "{{ openbao_init_output_path | expanduser }}"
        mode: "0600"
      delegate_to: localhost
      vars:
        ansible_become: false
      no_log: true

    # Токен нужен всем последующим шагам. Без него bao secrets list падает,
    # а условие на rc молча пропускает включение KV — и роль отчитывается
    # об успехе, ничего не настроив.
    - name: Remember the root token for the rest of the run
      ansible.builtin.set_fact:
        openbao_root_token: "{{ (openbao_init.stdout | from_json).root_token }}"
      no_log: true

    - name: Warn about the initialization output
      ansible.builtin.debug:
        msg: >-
          Хранилище инициализировано. Ключи распечатывания и КОРНЕВОЙ ТОКЕН
          сохранены на управляющей машине в
          {{ openbao_init_output_path | expanduser }} с правами 0600.
          Перенесите их в постоянное хранилище и удалите файл. Повторно они
          не выдаются: их потеря — потеря всех секретов без восстановления.
          В production корневой токен после настройки отзывается, а работа
          идёт через AppRole с ограниченной политикой.

# Хранилище уже было инициализировано ранее: токен взять неоткуда, кроме
# как от оператора. Молча продолжать нельзя — дальнейшие шаги требуют прав.
- name: Recover the root token from the saved output
  when:
    - openbao_root_token is not defined or openbao_root_token | length == 0
    - openbao_state.initialized | bool
  block:
    - name: Look for the saved initialization output
      ansible.builtin.stat:
        path: "{{ openbao_init_output_path | expanduser }}"
      delegate_to: localhost
      vars:
        ansible_become: false
      register: openbao_init_file

    - name: Read the saved root token
      ansible.builtin.slurp:
        src: "{{ openbao_init_output_path | expanduser }}"
      delegate_to: localhost
      vars:
        ansible_become: false
      register: openbao_saved_for_token
      when: openbao_init_file.stat.exists
      no_log: true

    - name: Restore the root token
      ansible.builtin.set_fact:
        openbao_root_token: "{{ (openbao_saved_for_token.content | b64decode | from_json).root_token }}"
      when: openbao_init_file.stat.exists
      no_log: true

- name: Unseal the store
  when:
    - openbao_auto_unseal | bool
    - openbao_state.sealed | default(true) | bool
  block:
    - name: Read the saved initialization output
      ansible.builtin.slurp:
        src: "{{ openbao_init_output_path | expanduser }}"
      delegate_to: localhost
      vars:
        ansible_become: false
      register: openbao_init_saved
      no_log: true

    - name: Apply the unseal keys
      ansible.builtin.command:
        cmd: "bao operator unseal {{ item }}"
      environment: "{{ openbao_cli_env }}"
      loop: >-
        {{ (openbao_init_saved.content | b64decode | from_json).unseal_keys_b64[: openbao_key_threshold | int] }}
      loop_control:
        label: "ключ {{ ansible_loop.index }} из {{ openbao_key_threshold }}"
        extended: true
      changed_when: true
      no_log: true
