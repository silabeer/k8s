---
# KV версии 2: путь обращения включает /data/, и роли проекта строят его
# как <mount>/data/<путь>. С KV v1 lookup вернул бы пустоту без ошибки.
# Без токена дальнейшее невозможно. Отдельная проверка, а не молчаливый
# пропуск: при первом прогоне отсутствие токена приводило к тому, что
# движок не включался, а роль отчитывалась об успехе.
- name: Require a root token for configuring the store
  ansible.builtin.assert:
    that:
      - openbao_root_token is defined
      - openbao_root_token | length > 0
    fail_msg: >-
      Нет токена для настройки хранилища. Он получается при инициализации
      либо из файла {{ openbao_init_output_path }}. Если хранилище
      инициализировано ранее, а файл удалён — передайте токен явно:
      -e openbao_root_token=<токен>.
    quiet: true

- name: List enabled secrets engines
  ansible.builtin.command:
    cmd: bao secrets list -format=json
  environment: "{{ openbao_cli_env }}"
  register: openbao_engines
  changed_when: false

- name: Enable the KV v2 engine
  ansible.builtin.command:
    cmd: "bao secrets enable -path={{ openbao_kv_mount }} -version=2 kv"
  environment: "{{ openbao_cli_env }}"
  when: (openbao_kv_mount ~ '/') not in (openbao_engines.stdout | from_json).keys() | list
  changed_when: true

- name: Report the store is ready
  ansible.builtin.debug:
    msg: >-
      OpenBao {{ openbao_version }} готов. Секреты кластеров кладутся в
      {{ openbao_kv_mount }}/kubernetes/<cluster_name>. Управляющей машине
      понадобятся переменные окружения ANSIBLE_HASHI_VAULT_TOKEN и
      ANSIBLE_HASHI_VAULT_CA_CERT — роли вызывают lookup только с url, и без
      них первый же прогон падает на CERTIFICATE_VERIFY_FAILED.
