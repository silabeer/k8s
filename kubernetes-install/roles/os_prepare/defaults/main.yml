---
# conntrack, socat, ethtool — требования kubeadm preflight.
# iptables нужен kube-proxy, nfs-common и open-iscsi — распространённым CSI.
os_prepare_base_packages:
  - apt-transport-https
  - ca-certificates
  - chrony
  - conntrack
  - curl
  - ethtool
  - gnupg
  - ipset
  - iptables
  - jq
  # Роль кладёт свой конфиг в /etc/logrotate.d — значит, обязана обеспечить
  # и сам logrotate: на минимальном образе его нет.
  - logrotate
  - nfs-common
  - open-iscsi
  - socat
  - tar

os_prepare_manage_hostname: true
os_prepare_manage_hosts: true

# Атомарная запись /etc/hosts. Отключается только в контейнере, где файл
# смонтирован извне и rename невозможен.
os_prepare_hosts_unsafe_writes: false
os_prepare_manage_ntp: true
os_prepare_manage_swap: true
os_prepare_manage_logrotate: true
os_prepare_manage_journald: true
os_prepare_manage_ca: true
os_prepare_manage_proxy: true

# Ограничение размера журнала: на узле с активными Pod journald по умолчанию
# способен занять весь /var и уронить kubelet по disk pressure.
os_prepare_journald_max_use: "2G"
os_prepare_journald_max_file_size: "128M"

# Диск etcd. Значения по умолчанию безопасны: на не-control-plane узлах
# блок пропускается целиком.
etcd_disk_manage: false
etcd_disk_device: ~
etcd_disk_mountpoint: /var/lib/etcd
etcd_disk_filesystem: ext4
etcd_disk_mount_opts: "defaults,noatime"

# Firewall выключен по умолчанию: в закрытом контуре фильтрация обычно
# вынесена на сетевое оборудование, а неаккуратный ufw ломает Cilium.
firewall_manage: false
os_prepare_firewall_extra_ports: []

# Узлы, которыми управляет этот проект: control-plane, worker и LB.
#
# Не groups['all']: inventory может содержать посторонние хосты — localhost
# провижнера, узлы соседних систем, — у которых нет node_ip, и проверка
# падала бы на них с невнятной ошибкой.
cluster_hosts: "{{ (groups['kubernetes'] | default([])) + (groups['load_balancers'] | default([])) }}"

# Хосты контура, которых может не быть во внутреннем DNS. Формат:
#   extra_hosts_entries:
#     - ip: 10.129.0.6
#       names: [registry.stand.local]
extra_hosts_entries: []

# Сертификат центра реестра контура. Задаётся в инвентаре вместе с
# registry_mirrors; пустое значение означает публично доверенный сертификат.
registry_ca_cert: ~

# Зеркала пакетов операционной системы в реестре контура. Пустые значения
# означают, что источники ОС не трогаются — так ведёт себя роль в контуре,
# где зеркало уже настроено образом ВМ.
os_apt_mirror_url: ""
os_apt_security_url: ""
