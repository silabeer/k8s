---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-osprep-cp-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs: [/run, /tmp]
    groups: [kubernetes, control_plane]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../../../molecule-shared/group_vars
    host_vars:
      molecule-osprep-cp-01:
        ansible_host: 10.99.0.21
    group_vars:
      all:
        # В контейнере hostname задаётся движком, а swap отсутствует —
        # соответствующие блоки роли проверяются на уровне 2.
        os_prepare_manage_hostname: false
        os_prepare_manage_swap: false
        etcd_disk_manage: false

verifier:
  name: ansible
