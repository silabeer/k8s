---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-osprep-cp-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs: [/run, /tmp]
    groups: [kubernetes, control_plane]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../../../molecule-shared/group_vars
    host_vars:
      molecule-osprep-cp-01:
        node_ip: 10.99.0.21
    # Отключение hostname, swap и диска etcd задано в общем файле
    # molecule-shared/group_vars/all.yml вместе с объяснением причин.

verifier:
  name: ansible
