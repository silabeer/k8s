---
# Кластерный сценарий на docker-драйвере: kubeadm поднимается внутри
# контейнеров, как это делает kind.
#
# Требования к контейнеру-узлу:
#   privileged        — монтирование, cgroup, iptables;
#   cgroupns_mode host — cgroup v2 для kubelet и containerd;
#   /lib/modules ro   — kubelet и Cilium читают сведения о модулях;
#   /dev/kmsg         — без него kubelet не стартует;
#   анонимный том на /var/lib/containerd — overlayfs поверх overlayfs
#                       не работает, снапшоттеру нужна настоящая ФС.
#
# Сеть и имена контейнеров уникальны для каждого сценария: destroy удаляет
# сеть, и общая сеть у параллельных сценариев в CI приводила бы к гонке.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-valid-cp-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
      - /var/lib/containerd
      - /var/lib/kubelet
      - /var/lib/etcd
    tmpfs: [/run, /tmp]
    devices:
      - /dev/kmsg:/dev/kmsg:rwm
    # Сеть объявляется один раз, на первой платформе
    docker_networks:
      - name: molecule-valid
        ipam_config:
          - subnet: 172.30.5.0/24
    networks:
      - name: molecule-valid
        ipv4_address: 172.30.5.21
    groups: [control_plane, kubernetes]

  - name: molecule-valid-worker-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
      - /var/lib/containerd
      - /var/lib/kubelet
    tmpfs: [/run, /tmp]
    devices:
      - /dev/kmsg:/dev/kmsg:rwm
    networks:
      - name: molecule-valid
        ipv4_address: 172.30.5.31
    groups: [workers, kubernetes]

provisioner:
  name: ansible
  # Сценарий лежит внутри роли, и molecule не добавляет каталог roles/
  # в путь поиска — без этого роль не находится по имени.
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    # molecule игнорирует inline host_vars/group_vars, когда задан links,
    # поэтому переменные сценария лежат файлами в inventory/.
    # Общий набор подключён симлинком inventory/group_vars/all/00-shared.yml.
    links:
      group_vars: inventory/group_vars
      host_vars: inventory/host_vars
verifier:
  name: ansible
