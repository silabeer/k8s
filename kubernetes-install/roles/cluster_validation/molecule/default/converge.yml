---
# Роль применяется на кластере без CNI: узлы NotReady, поэтому проверки,
# требующие Ready-узлов и Argo CD, отключены. Ценность сценария — аппрув
# kubelet serving CSR и проверки control plane, шифрования и etcd.
- name: Converge
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Apply the cluster_validation role
      ansible.builtin.include_role:
        name: cluster_validation
      vars:
        cluster_validation_check_network: false
        cluster_validation_check_argocd: false
        cluster_validation_check_storage: false
