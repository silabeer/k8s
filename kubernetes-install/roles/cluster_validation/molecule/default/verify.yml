---
- name: Verify
  hosts: control_plane[0]
  become: true
  gather_facts: true

  tasks:
    # Главное, что делает роль на этапе bootstrap: без аппрува serving CSR
    # остаются Pending, и metrics-server не может обращаться к kubelet
    # по TLS (раздел 14.4).
    - name: Get certificate signing requests
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: certificates.k8s.io/v1
        kind: CertificateSigningRequest
      register: csrs

    - name: Assert no kubelet serving CSR is left pending
      vars:
        pending: >-
          {{ csrs.resources
             | selectattr('spec.signerName', 'equalto', 'kubernetes.io/kubelet-serving')
             | rejectattr('status.conditions', 'defined')
             | map(attribute='metadata.name') | list }}
      ansible.builtin.assert:
        that:
          - pending | length == 0
        fail_msg: "Не аппрувнуты kubelet serving CSR: {{ pending }}"
        quiet: true

    - name: Assert every node has an approved serving certificate
      vars:
        approved_nodes: >-
          {{ csrs.resources
             | selectattr('spec.signerName', 'equalto', 'kubernetes.io/kubelet-serving')
             | selectattr('status.conditions', 'defined')
             | map(attribute='spec.username')
             | map('regex_replace', '^system:node:', '') | unique | list }}
      ansible.builtin.assert:
        that:
          - groups['kubernetes'] | difference(approved_nodes) | length == 0
        fail_msg: >-
          Нет аппрувнутого serving-сертификата для узлов:
          {{ groups['kubernetes'] | difference(approved_nodes) }}
        quiet: true

    - name: Verify kubelet metrics are reachable over TLS
      # Прямое следствие аппрува: без валидного serving-сертификата запрос
      # падает на TLS.
      ansible.builtin.command:
        cmd: "kubectl get --raw /api/v1/nodes/{{ item }}/proxy/metrics"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: "{{ groups['kubernetes'] }}"
      register: kubelet_metrics
      changed_when: false
      failed_when: kubelet_metrics.rc != 0

    - name: Re-run the encryption checks
      ansible.builtin.include_role:
        name: cluster_validation
        tasks_from: validate_encryption

    - name: Re-run the etcd checks
      ansible.builtin.include_role:
        name: cluster_validation
        tasks_from: validate_etcd

    - name: Re-run the certificate expiry checks
      ansible.builtin.include_role:
        name: cluster_validation
        tasks_from: validate_certificates

    - name: Assert freshly issued certificates are far from expiry
      ansible.builtin.assert:
        that:
          - cluster_validation_cert_days | min > 300
        fail_msg: >-
          Только что выпущенные сертификаты control plane показывают
          {{ cluster_validation_cert_days | min }} дней до истечения —
          разбор вывода kubeadm certs check-expiration сломан (S10).
        quiet: true
