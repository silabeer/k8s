---
# Knot DNS — авторитативный сервер зоны контура (ADR 0006).
#
# СТАТУС: роль написана, на живом сервере НЕ ПРОВЕРЯЛАСЬ. Всё, что в этом
# проекте не прогонялось на настоящих машинах, содержало ошибки — считать
# рабочей только после первого успешного прогона.

# primary   — скрытый первичный: принимает выкладку из Git и DDNS,
#             в NS-записях НЕ значится;
# secondary — обслуживает запросы, тянет зоны с первичного.
knot_role: secondary # primary | secondary

knot_config_dir: /etc/knot
knot_storage_dir: /var/lib/knot
knot_user: knot

# Адреса, на которых слушать. У первичного имеет смысл сузить до
# внутреннего: снаружи к нему обращаться некому.
knot_listen:
  - "0.0.0.0@53"
  - "::@53"

# -----------------------------------------------------------------------------
# Топология
# -----------------------------------------------------------------------------
# Адрес первичного — нужен вторичным, чтобы тянуть зону.
knot_primary_address: ~

# Адреса вторичных — нужны первичному: он им шлёт NOTIFY и только им
# разрешает передачу зоны.
knot_secondary_addresses: []

# -----------------------------------------------------------------------------
# Ключи TSIG
#
# Два РАЗНЫХ ключа, и это не формальность (ADR 0006, раздел 5):
#   transfer    — вторичным, на передачу зон;
#   acme-update — cert-manager, на UPDATE ТОЛЬКО динамической зоны.
# Общий ключ означал бы, что компрометация cert-manager даёт власть над
# записями всех сервисов.
#
# Значения берутся из секрет-бэкенда, в inventory их быть не должно.
# Генерируются: keymgr -t <имя> hmac-sha256
# -----------------------------------------------------------------------------
knot_tsig_transfer_key: ~
knot_tsig_acme_key: ~
knot_tsig_algorithm: hmac-sha256

# -----------------------------------------------------------------------------
# Зоны
#
# Статическая зона описывается записями в inventory или GitOps-репозитории;
# динамическая записей не имеет вовсе — их пишет cert-manager.
#
#   knot_zones:
#     - name: idp.mbrd.ru
#       dynamic: false
#       records:
#         - {name: "@",       type: NS, value: "ns1.mbrd.ru."}
#         - {name: gateway,   type: A,  value: "10.10.20.1"}
#         - {name: "_acme-challenge.gateway", type: CNAME,
#            value: "gateway.acme.idp.mbrd.ru."}
#     - name: acme.idp.mbrd.ru
#       dynamic: true
#       # NS в вершине обязательны и у динамической зоны: без них это не
#       # зона, и kzonecheck отвергает её с «missing NS at the zone apex».
#       # Записей челленджей здесь быть не должно — их пишет cert-manager.
#       records:
#         - {name: "@", type: NS, value: "ns1.mbrd.ru."}
# -----------------------------------------------------------------------------
knot_zones: []

knot_soa_primary_ns: ~ # ns1.mbrd.ru.
knot_soa_email: ~ # hostmaster.mbrd.ru.
knot_soa_refresh: 3600
knot_soa_retry: 900

# expire — ЕДИНСТВЕННЫЙ таймер, превращающий поломку репликации в отказ.
# Пока он не истёк, вторичные отдают устаревшее, и это правильно:
# устаревший ответ лучше отсутствующего. Недели, не часы (ADR 0006).
knot_soa_expire: 2419200 # 4 недели
knot_soa_minimum: 300
knot_default_ttl: 300

# На Ubuntu порт 53 занят stub-слушателем systemd-resolved, и Knot не
# стартует. Выключается на выделенных серверах DNS; на машине, где Knot
# соседствует с чем-то ещё, значение стоит пересмотреть.
knot_disable_stub_listener: true

knot_manage_service: true
