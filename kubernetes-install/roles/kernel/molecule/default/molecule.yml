---
# Уровень 1: контейнерный тест. Проверяется рендер конфигурации.
# Фактическое применение sysctl невозможно в контейнере (kernel.* лежат вне
# namespace) и покрывается VM-тестом уровня 2.
#
# Ключ `lint` в molecule.yml не используется: он удалён в Molecule 6,
# линтеры запускаются из Makefile и CI.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-kernel-cp-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    privileged: false
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - kubernetes
      - control_plane

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../../../molecule-shared/group_vars
    host_vars:
      molecule-kernel-cp-01:
        ansible_host: 10.99.0.21

verifier:
  name: ansible
