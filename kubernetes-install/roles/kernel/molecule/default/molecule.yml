---
# Уровень 1: контейнерный тест. Проверяется рендер конфигурации.
# Фактическое применение sysctl невозможно в контейнере (kernel.* лежат вне
# namespace) и покрывается VM-тестом уровня 2.
#
# Ключ `lint` в molecule.yml не используется: он удалён в Molecule 6,
# линтеры запускаются из Makefile и CI.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: molecule-kernel-cp-01
    image: "${MOLECULE_IMAGE:-harbor.company.local/test/ubuntu-systemd:24.04}"
    command: /lib/systemd/systemd
    # systemd в контейнере требует privileged: без него init не может
    # управлять cgroup и падает сразу. Это относится и к контейнерам,
    # которые не запускают Kubernetes.
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - kubernetes
      - control_plane

provisioner:
  name: ansible
  # Сценарий лежит внутри роли, и molecule не добавляет каталог roles/
  # в путь поиска — без этого роль не находится по имени.
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    # molecule игнорирует inline host_vars/group_vars, когда задан links,
    # поэтому переменные сценария лежат файлами в inventory/.
    # Общий набор подключён симлинком inventory/group_vars/all/00-shared.yml.
    links:
      group_vars: inventory/group_vars
      host_vars: inventory/host_vars
verifier:
  name: ansible
