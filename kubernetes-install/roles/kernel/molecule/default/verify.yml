---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Полный набор, который kubelet проверяет при protectKernelDefaults: true.
    # Это регрессионный тест на блокер B1: в playbook v2.0 перечислялись
    # только три значения из шести, и kubelet не стартовал ни на одном узле.
    expected_protect_defaults:
      vm.overcommit_memory: 1
      vm.panic_on_oom: 0
      kernel.panic: 10
      kernel.panic_on_oops: 1
      kernel.keys.root_maxkeys: 1000000
      kernel.keys.root_maxbytes: 25000000

  tasks:
    - name: Stat the modules configuration
      ansible.builtin.stat:
        path: /etc/modules-load.d/99-kubernetes.conf
      register: modules_conf

    - name: Assert the modules configuration exists with correct permissions
      ansible.builtin.assert:
        that:
          - modules_conf.stat.exists
          - modules_conf.stat.mode == '0644'
          - modules_conf.stat.pw_name == 'root'
        quiet: true

    - name: Read the modules configuration
      ansible.builtin.slurp:
        src: /etc/modules-load.d/99-kubernetes.conf
      register: modules_content

    - name: Assert required modules are listed
      ansible.builtin.assert:
        that:
          - (modules_content.content | b64decode) is search('^overlay$', multiline=True)
          - (modules_content.content | b64decode) is search('^br_netfilter$', multiline=True)
        fail_msg: "В modules-load.d отсутствуют overlay или br_netfilter."
        quiet: true

    - name: Stat the sysctl configuration
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-kubernetes.conf
      register: sysctl_conf

    - name: Assert the sysctl configuration exists with correct permissions
      ansible.builtin.assert:
        that:
          - sysctl_conf.stat.exists
          - sysctl_conf.stat.mode == '0644'
        quiet: true

    - name: Read the sysctl configuration
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-kubernetes.conf
      register: sysctl_content

    - name: Assert every protectKernelDefaults value is present
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode)
            is search('^' ~ (item.key | regex_escape) ~ '\s*=\s*' ~ item.value ~ '$', multiline=True)
        fail_msg: >-
          В sysctl.d отсутствует {{ item.key }} = {{ item.value }}.
          Без полного набора из шести значений kubelet с
          protectKernelDefaults: true не стартует (B1).
        success_msg: "{{ item.key }} = {{ item.value }}"
        quiet: true
      loop: "{{ expected_protect_defaults | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert Kubernetes networking sysctls are present
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode)
            is search('^' ~ (item | regex_escape) ~ '\s*=\s*1$', multiline=True)
        fail_msg: "В sysctl.d отсутствует {{ item }} = 1."
        quiet: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Assert inotify limits are raised
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('fs.inotify.max_user_instances')
          - (sysctl_content.content | b64decode) is search('fs.inotify.max_user_watches')
        fail_msg: >-
          Не подняты лимиты inotify — узел с сотнями Pod упрётся в дефолты.
        quiet: true
