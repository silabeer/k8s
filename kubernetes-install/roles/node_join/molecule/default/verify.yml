---
- name: Verify
  hosts: workers
  become: true
  gather_facts: true

  tasks:
    - name: Re-run the precheck
      ansible.builtin.include_role:
        name: node_join
        tasks_from: precheck

    - name: Assert the joined node is recognised
      ansible.builtin.assert:
        that:
          - node_join_already_done | bool
        fail_msg: "Роль не распознала присоединённый узел — join выполнился бы снова."
        quiet: true

    - name: Get the node object
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Node
        name: "{{ inventory_hostname }}"
      delegate_to: "{{ groups['control_plane'] | first }}"
      register: node

    # Регрессионный тест на B2. Именно здесь он и имеет смысл: в контейнере
    # NodeRestriction не проверить, а join с node-role.kubernetes.io/* в
    # --node-labels отклоняется на этапе регистрации.
    - name: Assert the role label was assigned after join
      ansible.builtin.assert:
        that:
          - "'node-role.kubernetes.io/worker' in node.resources[0].metadata.labels"
        fail_msg: >-
          Нет label node-role.kubernetes.io/worker. Его нельзя передать через
          kubelet --node-labels: NodeRestriction запрещает kubelet выставлять
          labels в домене kubernetes.io, и регистрация узла падает (B2).
        quiet: true

    - name: Assert the node-pool label came from registration
      ansible.builtin.assert:
        that:
          - node.resources[0].metadata.labels['node-pool'] == node_pool
        fail_msg: >-
          Label node-pool отсутствует или не совпадает. Бездоменные labels
          NodeRestriction пропускает, поэтому они назначаются при регистрации.
        quiet: true

    - name: Assert the advertised internal address matches inventory
      vars:
        internal_ips: >-
          {{ node.resources[0].status.addresses
             | selectattr('type', 'equalto', 'InternalIP')
             | map(attribute='address') | list }}
      ansible.builtin.assert:
        that:
          - node_ip in internal_ips
        fail_msg: "InternalIP {{ internal_ips }} не совпадает с {{ node_ip }}."
        quiet: true

    - name: Assert no join configuration was left on disk
      # Файл содержит bootstrap token и certificate key.
      ansible.builtin.stat:
        path: /etc/kubernetes/kubeadm-join.yaml
      register: join_config
      failed_when: join_config.stat.exists
