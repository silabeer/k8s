---
# Интеграционный прогон полного site.yml на VM-стенде (уровень 2).
#
# Запускается на merge в main и по ночному расписанию. Стенд уничтожается
# после прогона, чтобы не накапливать дрейф (раздел 25.5).
#
#   cd molecule-integration && molecule test -s site-full
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default

platforms:
  - name: molecule-lb-01
    groups: [load_balancers]
  - name: molecule-lb-02
    groups: [load_balancers]
  - name: molecule-cp-01
    groups: [control_plane, kubernetes]
  - name: molecule-cp-02
    groups: [control_plane, kubernetes]
  - name: molecule-cp-03
    groups: [control_plane, kubernetes]
  - name: molecule-worker-01
    groups: [workers, kubernetes]

provisioner:
  name: ansible
  playbooks:
    create: ../../molecule-shared/resources/create-vms.yml
    destroy: ../../molecule-shared/resources/destroy-vms.yml
  inventory:
    links:
      group_vars: ../../molecule-shared/group_vars
    host_vars:
      molecule-lb-01:
        ansible_host: 192.168.121.10
        keepalived_priority: 150
        keepalived_state: MASTER
      molecule-lb-02:
        ansible_host: 192.168.121.11
        keepalived_priority: 100
        keepalived_state: BACKUP
      molecule-cp-01:
        ansible_host: 192.168.121.21
      molecule-cp-02:
        ansible_host: 192.168.121.22
      molecule-cp-03:
        ansible_host: 192.168.121.23
      molecule-worker-01:
        ansible_host: 192.168.121.31
    group_vars:
      all:
        # На стенде VIP обслуживается собственной парой LB
        api_vip: "192.168.121.20"
        api_vip_managed: true
        api_vip_interface: eth1
        control_plane_endpoint_host: "k8s-api.molecule.test"
        corporate_networks: ["192.168.121.0/24"]
        haproxy_package_version: "*"
        keepalived_package_version: "*"
        node_mtu: 1500
      control_plane:
        etcd_disk_manage: true
        etcd_disk_device: /dev/vdb
        preflight_min_cpu: 2
        preflight_min_ram_mb: 3500
        preflight_min_disk_root_gb: 10
        preflight_min_disk_etcd_gb: 15
      workers:
        preflight_min_cpu: 2
        preflight_min_ram_mb: 3500
        preflight_min_disk_root_gb: 10
        node_pool: general
      load_balancers:
        preflight_min_cpu: 1
        preflight_min_ram_mb: 900
        preflight_min_disk_root_gb: 5

verifier:
  name: ansible
