---
# Проверки, недоступные сценариям отдельных ролей: многоузловой кластер,
# VRRP между парой LB, идемпотентность полного прогона.
#
# Стенд контейнерный, поэтому три вещи здесь не проверяются и закрыты иначе
# (см. molecule-shared/group_vars/all.yml и README):
#   * фактические sysctl protectKernelDefaults — kernel.* не изолируются
#     namespace, внутри контейнера видны значения хоста;
#   * отключение swap — /proc/swaps показывает swap хоста;
#   * отдельный диск под etcd — блочное устройство контейнеру не подключить.

- name: Verify node-level state
  hosts: kubernetes
  become: true
  gather_facts: true

  tasks:
    # Выполняется, только если хост CI подготовлен (`make ci-host-prereq`)
    # и задан MOLECULE_HOST_SYSCTLS_SET: тогда kubelet действительно работает
    # с protectKernelDefaults: true и проверка имеет смысл.
    - name: Verify protectKernelDefaults sysctls on a prepared host
      when: kubelet_protect_kernel_defaults | bool
      block:
        - name: Read effective sysctls
          ansible.builtin.slurp:
            src: "/proc/sys/{{ item.key | replace('.', '/') }}"
          loop: "{{ expected | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          vars:
            expected:
              vm.overcommit_memory: 1
              vm.panic_on_oom: 0
              kernel.panic: 10
              kernel.panic_on_oops: 1
              kernel.keys.root_maxkeys: 1000000
              kernel.keys.root_maxbytes: 25000000
          register: effective_sysctls

        - name: Assert every protectKernelDefaults value is effective
          ansible.builtin.assert:
            that:
              - (item.content | b64decode | trim | int) == (item.item.value | int)
            fail_msg: >-
              sysctl {{ item.item.key }} = {{ item.content | b64decode | trim }},
              kubelet ожидает {{ item.item.value }} (B1).
            quiet: true
          loop: "{{ effective_sysctls.results }}"
          loop_control:
            label: "{{ item.item.key }}"

    - name: Report skipped kernel checks
      ansible.builtin.debug:
        msg: >-
          Проверка фактических sysctl пропущена: kernel.* внутри контейнера
          принадлежат хосту. Корректность набора из шести значений проверяет
          сценарий роли kernel. Чтобы проверить и поведение kubelet,
          подготовьте хост (`make ci-host-prereq`) и задайте
          MOLECULE_HOST_SYSCTLS_SET=true.
      when: not kubelet_protect_kernel_defaults | bool
      run_once: true

    - name: Assert kubelet is running  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl is-active kubelet
      register: kubelet_state
      changed_when: false
      failed_when: kubelet_state.stdout | trim != 'active'

    - name: Assert containerd state lives on a real filesystem
      # Анонимный docker-том на /var/lib/containerd: overlayfs поверх
      # overlayfs не работает, снапшоттер ломается при первом же пулле.
      ansible.builtin.command:
        cmd: findmnt --noheadings --output FSTYPE --target /var/lib/containerd
      register: containerd_fs
      changed_when: false
      failed_when: containerd_fs.stdout | trim == 'overlay'

- name: Verify load balancer failover
  hosts: load_balancers
  become: true
  gather_facts: true

  tasks:
    - name: Determine the current VIP holder
      ansible.builtin.command:
        cmd: "ip -o -4 addr show dev {{ api_vip_interface }}"
      register: vip_addrs
      changed_when: false

    - name: Record VIP ownership
      ansible.builtin.set_fact:
        holds_vip: "{{ api_vip in vip_addrs.stdout }}"

    - name: Assert exactly one node holds the VIP
      vars:
        holders: >-
          {{ groups['load_balancers'] | map('extract', hostvars)
             | selectattr('holds_vip', 'defined') | selectattr('holds_vip')
             | map(attribute='inventory_hostname') | list }}
      ansible.builtin.assert:
        that:
          - holders | length == 1
        fail_msg: "VIP держат: {{ holders }} (должен ровно один)."
        quiet: true
      run_once: true

    - name: Test VRRP failover by stopping haproxy on the master
      when: holds_vip | bool
      block:
        - name: Stop haproxy
          ansible.builtin.systemd:
            name: haproxy
            state: stopped

        - name: Wait for the VIP to move away
          ansible.builtin.command:
            cmd: "ip -o -4 addr show dev {{ api_vip_interface }}"
          register: vip_after_stop
          changed_when: false
          retries: 12
          delay: 5
          until: api_vip not in vip_after_stop.stdout

      always:
        - name: Start haproxy again
          ansible.builtin.systemd:
            name: haproxy
            state: started

    - name: Wait for the VIP to return to the master
      ansible.builtin.command:
        cmd: "ip -o -4 addr show dev {{ api_vip_interface }}"
      register: vip_restored
      changed_when: false
      retries: 12
      delay: 5
      until: api_vip in vip_restored.stdout
      when: holds_vip | bool

    - name: Assert the API is reachable through the VIP
      ansible.builtin.uri:
        url: "https://{{ api_vip }}:{{ control_plane_endpoint_port }}/livez"
        validate_certs: false
        status_code: 200
      register: vip_livez
      retries: 12
      delay: 5
      until: vip_livez.status == 200
      run_once: true

- name: Verify cluster state
  hosts: control_plane[0]
  become: true
  gather_facts: true

  tasks:
    - name: Assert all nodes are registered
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Node
      register: nodes
      failed_when: nodes.resources | length != groups['kubernetes'] | length

    # Регрессионный тест на B2: kubelet не может назначить себе label
    # в домене kubernetes.io, роль выставляется после join от cluster-admin.
    - name: Assert worker nodes carry the role label
      vars:
        unlabeled: >-
          {{ nodes.resources
             | selectattr('metadata.name', 'in', groups['workers'])
             | rejectattr('metadata.labels', 'contains', 'node-role.kubernetes.io/worker')
             | map(attribute='metadata.name') | list }}
      ansible.builtin.assert:
        that:
          - unlabeled | length == 0
        fail_msg: >-
          На worker-узлах нет label node-role.kubernetes.io/worker: {{ unlabeled }}.
          Попытка выставить его через kubelet --node-labels отклоняется
          NodeRestriction (B2).
        quiet: true

    - name: Assert the node-pool label survived registration
      vars:
        unlabeled: >-
          {{ nodes.resources
             | selectattr('metadata.name', 'in', groups['workers'])
             | rejectattr('metadata.labels', 'contains', 'node-pool')
             | map(attribute='metadata.name') | list }}
      ansible.builtin.assert:
        that:
          - unlabeled | length == 0
        fail_msg: "Отсутствует label node-pool: {{ unlabeled }}"
        quiet: true

    - name: Assert etcd has a quorum of three members
      ansible.builtin.command:
        cmd: >-
          kubectl -n kube-system exec etcd-{{ inventory_hostname }} --
          etcdctl
          --cacert=/etc/kubernetes/pki/etcd/ca.crt
          --cert=/etc/kubernetes/pki/etcd/server.crt
          --key=/etc/kubernetes/pki/etcd/server.key
          member list -w json
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: etcd_members
      changed_when: false
      failed_when: >-
        ((etcd_members.stdout | from_json).members | length)
        != (groups['control_plane'] | length)

    - name: Run the control plane security assertions
      ansible.builtin.include_role:
        name: cluster_validation
        tasks_from: validate_encryption

    # Ключевой тест идемпотентности (раздел 24): повторный прогон не должен
    # выполнять kubeadm init — иначе создастся новый кластер.
    - name: Re-run control plane initialization to prove idempotency
      ansible.builtin.include_role:
        name: control_plane_init

    - name: Assert kubeadm init was skipped on the second run
      ansible.builtin.assert:
        that:
          - control_plane_init_already_done | bool
        fail_msg: >-
          Повторный прогон control_plane_init не распознал уже
          инициализированный кластер — kubeadm init выполнился бы снова.
        quiet: true

- name: Verify node join idempotency
  hosts: workers
  become: true
  gather_facts: true

  tasks:
    - name: Re-run the join role
      ansible.builtin.include_role:
        name: node_join
      vars:
        node_join_type: worker

    - name: Assert the join was skipped
      ansible.builtin.assert:
        that:
          - node_join_already_done | bool
        fail_msg: "Повторный прогон node_join не распознал присоединённый узел."
        quiet: true
