---
# Прогон реального site.yml, а не его копии: расхождение между тем, что
# тестируется, и тем, что выполняется в production, обесценивает тест.

- name: Stage 00 — preflight checks
  import_playbook: ../../playbooks/00-preflight.yml
- name: Stage 05 — API endpoint load balancer
  import_playbook: ../../playbooks/05-load-balancer.yml
- name: Stage 10 — operating system preparation
  import_playbook: ../../playbooks/10-os-prepare.yml
- name: Stage 20 — containerd
  import_playbook: ../../playbooks/20-containerd.yml
- name: Stage 30 — Kubernetes packages
  import_playbook: ../../playbooks/30-kubernetes-packages.yml
- name: Stage 40 — first control-plane node
  import_playbook: ../../playbooks/40-control-plane-init.yml
- name: Stage 41 — remaining control-plane nodes
  import_playbook: ../../playbooks/41-control-plane-join.yml
- name: Stage 42 — worker nodes
  import_playbook: ../../playbooks/42-workers-join.yml

# Этапы 50 и 60 требуют тестового GitOps-репозитория и секрет-бэкенда.
# Без них узлы останутся NotReady — это ожидаемо и проверяется в verify.
- name: Bootstrap CNI and Argo CD when a test GitOps repository is configured
  hosts: control_plane[0]
  become: true
  gather_facts: true
  tasks:
    - name: Bootstrap Cilium
      ansible.builtin.include_role:
        name: cilium_bootstrap
      when: molecule_gitops_available | default(false) | bool

    - name: Bootstrap Argo CD
      ansible.builtin.include_role:
        name: argocd_bootstrap
      when: molecule_gitops_available | default(false) | bool
