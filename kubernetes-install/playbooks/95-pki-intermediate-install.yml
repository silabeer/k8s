---
# Шаг 2 церемонии: загрузить подписанный интермедиат обратно.
#
# Между этим playbook и 94-м стоит человек с изолированной машиной. Здесь
# автоматизация возобновляется.
#
# Два шага, которые легко забыть и которые оба стоили разбора на стенде:
#   * переключить издателя по умолчанию — set-signed создаёт НОВОГО
#     издателя, а умолчанием остаётся прежний, и движок продолжает
#     подписывать старым сертификатом; текст ошибки при этом не меняется
#     ни на букву, и выглядит так, будто исправление не подействовало;
#   * проверить pathlen — интермедиат под SPIRE обязан допускать ещё один
#     уровень CA, а интермедиат для листовых обязан его запрещать.
- name: Install a signed intermediate certificate
  hosts: secret_backend
  become: true
  gather_facts: false

  vars:
    pki_mount: ~
    pki_signed_cert: ~ # файл НА УПРАВЛЯЮЩЕЙ МАШИНЕ: интермедиат + корень
    pki_expect_pathlen: ~ # 0 или 1 — обязательный параметр, см. ниже

  tasks:
    - name: Assert the parameters are given
      ansible.builtin.assert:
        that:
          - pki_mount is not none
          - pki_signed_cert is not none
          - pki_expect_pathlen is not none
        fail_msg: >-
          Задайте pki_mount, pki_signed_cert и pki_expect_pathlen.
          Последний обязателен намеренно: неверный pathlen — самая дорогая
          ошибка этой церемонии, потому что проявляется она не здесь, а
          позже и невнятно.
        quiet: true

    - name: Read the signed certificate
      ansible.builtin.slurp:
        src: "{{ pki_signed_cert }}"
      register: pki_signed
      delegate_to: localhost
      vars:
        # См. пояснение в 94-pki-intermediate-request.yml: ключевое слово
        # `become: false` не перебивает ansible_become из инвентаря.
        ansible_become: false

    - name: Assert the certificate has the expected path length
      # Проверка ДО загрузки: после неё разбираться дороже. С pathlen:0
      # сервер SPIRE падает при старте с «signing certificate has a max
      # path length of zero», а с лишним pathlen интермедиат для листовых
      # разрешает выпуск CA, чего быть не должно.
      ansible.builtin.assert:
        that:
          # Требуется ЯВНОЕ pathlen:N. Отсутствие ограничения означает не
          # ноль, а неограниченную длину цепочки — то есть прямо обратное
          # тому, что мы проверяем. Первая версия этой проверки такой
          # сертификат пропускала.
          - ('pathlen:' ~ pki_expect_pathlen) in pki_cert_text
        fail_msg: >-
          В сертификате нет ожидаемого ограничения длины пути
          (pathlen:{{ pki_expect_pathlen }}). Подпишите заново с верным
          basicConstraints — иначе отказ проявится позже: SPIRE не
          стартует либо интермедиат разрешает выпуск CA.
        quiet: true
      vars:
        pki_cert_text: >-
          {{ lookup('pipe', 'openssl x509 -noout -text -in '
             ~ pki_signed_cert ~ " | tr -d ' '") }}

    - name: Copy the signed certificate to the backend
      ansible.builtin.copy:
        content: "{{ pki_signed.content | b64decode }}"
        dest: "/tmp/{{ pki_mount }}-signed.crt"
        owner: root
        group: root
        mode: "0600"

    # -format=json, а не -field: при ПОВТОРНОМ прогоне импортировать нечего,
    # поля imported_issuers в ответе нет вовсе, и -field падает с
    # «Field "imported_issuers" not present in secret». Церемония же
    # повторяется — хотя бы когда её прогоняют второй раз после разбора, —
    # поэтому playbook обязан это переживать.
    - name: Import the signed certificate
      ansible.builtin.command:
        argv:
          - bao
          - write
          - -format=json
          - "{{ pki_mount }}/intermediate/set-signed"
          - "certificate=@/tmp/{{ pki_mount }}-signed.crt"
      environment: &bao_env
        BAO_ADDR: "{{ openbao_url | default('https://127.0.0.1:8200') }}"
        # default() обязателен: playbook НЕ подключает роль openbao, а
        # значит её умолчания ему недоступны. Без него отказ приходит на
        # первой же задаче и говорит про undefined variable, а не про то,
        # что переменную надо задать.
        BAO_CACERT: "{{ openbao_tls_dir | default('/opt/openbao/tls') }}/tls.crt"
        BAO_TOKEN: "{{ openbao_token }}"
      register: pki_imported
      changed_when: true

    - name: Determine which issuer to make default
      # imported_issuers — при первом импорте, existing_issuers — при
      # повторном. Пустой результат означает, что сертификат в mount не
      # попал, и это отказ, а не «нечего делать».
      #
      # default([], true) — со вторым аргументом обязательно: поле в ответе
      # ПРИСУТСТВУЕТ, но равно null, а обычный default() срабатывает только
      # на неопределённое значение и null пропускает дальше.
      ansible.builtin.set_fact:
        pki_issuer_id: >-
          {{ ((pki_imported.stdout | from_json).data.imported_issuers | default([], true))
             + ((pki_imported.stdout | from_json).data.existing_issuers | default([], true)) }}

    - name: Assert the certificate reached the mount
      ansible.builtin.assert:
        that:
          - pki_issuer_id | length > 0
        fail_msg: >-
          set-signed не вернул ни imported_issuers, ни existing_issuers —
          сертификат в mount не попал. Проверьте, что подписан именно тот
          CSR, который выдал 94-pki-intermediate-request.yml: чужой CSR
          означает, что закрытый ключ в mount'е не соответствует
          сертификату.
        quiet: true

    - name: Make the certificate the default issuer
      # Шаг, который легко пропустить: set-signed создаёт нового издателя,
      # а умолчанием остаётся прежний, и движок продолжает подписывать
      # старым сертификатом. Текст ошибки при этом не меняется ни на букву.
      ansible.builtin.command:
        argv:
          - bao
          - write
          - "{{ pki_mount }}/config/issuers"
          - "default={{ pki_issuer_id | first }}"
      environment: *bao_env
      changed_when: true

    - name: Read back what the mount now signs with
      ansible.builtin.command:
        argv: [bao, read, -field=certificate, "{{ pki_mount }}/cert/ca"]
      environment: *bao_env
      register: pki_active
      changed_when: false

    - name: Remove the temporary copy
      ansible.builtin.file:
        path: "/tmp/{{ pki_mount }}-signed.crt"
        state: absent

    - name: Report the active issuer
      ansible.builtin.debug:
        msg: >-
          {{ pki_mount }} подписывает сертификатом:
          {{ pki_active.stdout | regex_search('(?s).*') | length }} байт.
          Проверьте, что это именно новый издатель:
          bao read {{ pki_mount }}/config/issuers
