---
# Upgrade, этап 20. Остальные control-plane узлы, последовательно.
# Здесь `kubeadm upgrade node`, а не `apply`.

- name: Upgrade remaining control-plane nodes
  hosts: control_plane[1:]
  serial: 1
  gather_facts: true
  any_errors_fatal: true
  become: true

  tasks:
    - name: Unhold kubeadm package
      ansible.builtin.dpkg_selections:
        name: kubeadm
        selection: install

    - name: Install target kubeadm version
      ansible.builtin.apt:
        name: "kubeadm={{ kubernetes_target_apt_version }}"
        state: present
        allow_change_held_packages: true
        update_cache: true

    - name: Hold kubeadm package
      ansible.builtin.dpkg_selections:
        name: kubeadm
        selection: hold

    - name: Upgrade node configuration
      ansible.builtin.command:
        cmd: kubeadm upgrade node
      changed_when: true

    - name: Upgrade kubelet and kubectl
      ansible.builtin.include_tasks: tasks/upgrade-node-packages.yml

    - name: Wait for API server on this node to become ready
      ansible.builtin.uri:
        url: "https://127.0.0.1:6443/readyz"
        validate_certs: false
        status_code: 200
      register: readyz
      retries: 30
      delay: 10
      until: readyz.status == 200
