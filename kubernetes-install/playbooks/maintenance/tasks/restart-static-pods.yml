---
# Перезапуск static pods control plane перемещением манифестов.
# kubelet удаляет Pod при исчезновении файла и создаёт заново при появлении.
# Это надёжнее `crictl rm`, который kubelet может пережить кэшем.
#
# Возврат манифестов вынесен в always: если ожидание остановки контейнеров
# упрётся в таймаут, play прервался бы с манифестами ВНЕ каталога, и
# control plane на узле не поднялся бы до ручного вмешательства.

- name: Restart control plane static pods
  block:
    - name: Create temporary manifest directory
      ansible.builtin.file:
        path: /etc/kubernetes/manifests-restart
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Move static pod manifests out
      ansible.builtin.command:
        cmd: "mv /etc/kubernetes/manifests/{{ item }}.yaml /etc/kubernetes/manifests-restart/{{ item }}.yaml"
        removes: "/etc/kubernetes/manifests/{{ item }}.yaml"
      loop:
        - kube-apiserver
        - kube-controller-manager
        - kube-scheduler
        - etcd
      changed_when: true

    - name: Wait for static pod containers to stop
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          crictl ps --quiet
          --label io.kubernetes.pod.namespace=kube-system
          --name 'kube-apiserver|kube-controller-manager|kube-scheduler|etcd'
          | wc -l
      args:
        executable: /bin/bash
      register: running_containers
      changed_when: false
      retries: 30
      delay: 5
      until: running_containers.stdout | trim | int == 0

  always:
    # Выполняется и при успехе, и при отказе ожидания: манифесты обязаны
    # вернуться на место в любом случае.
    - name: Move static pod manifests back
      ansible.builtin.command:
        cmd: "mv /etc/kubernetes/manifests-restart/{{ item }}.yaml /etc/kubernetes/manifests/{{ item }}.yaml"
        removes: "/etc/kubernetes/manifests-restart/{{ item }}.yaml"
      loop:
        - etcd
        - kube-apiserver
        - kube-controller-manager
        - kube-scheduler
      changed_when: true

    - name: Assert no manifest was left behind
      ansible.builtin.find:
        paths: /etc/kubernetes/manifests-restart
        patterns: "*.yaml"
      register: leftover_manifests
      failed_when: leftover_manifests.files | default([]) | length > 0

    - name: Remove temporary manifest directory
      ansible.builtin.file:
        path: /etc/kubernetes/manifests-restart
        state: absent
