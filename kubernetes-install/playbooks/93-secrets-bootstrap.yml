---
# Начальная загрузка секретов контура в OpenBao.
#
# Закрывает последний разрыв воспроизводимости (раздел 0.2 плана, пункт 2):
# до сих пор общий центр сертификации Cluster Mesh и ключи шифрования etcd
# раскладывались руками, и «поднять стенд с нуля одной командой» не
# получалось.
#
# Выполняется НА УПРАВЛЯЮЩЕЙ МАШИНЕ: ключи не должны появляться на узлах
# даже на мгновение, а обращение к OpenBao и так идёт отсюда.
#
# ГЛАВНОЕ СВОЙСТВО: playbook НИЧЕГО НЕ ПЕРЕЗАПИСЫВАЕТ. Повторный прогон на
# работающем контуре безопасен. Замена ключа шифрования etcd сделала бы
# нечитаемыми все Secrets кластера, а замена общего CA — развалила бы
# Cluster Mesh: соседние кластеры перестали бы доверять друг другу, и
# обнаружилось бы это не сразу.
- name: Bootstrap the contour secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Права root на управляющей машине не нужны, а инвентарь общих служб
    # задаёт ansible_become: true для всех. Отключается именно переменной:
    # ключевое слово play `become: false` не помогает — переменная
    # инвентаря имеет более высокий приоритет, и playbook всё равно уходит
    # в sudo, падая там, где ему нечего делать.
    ansible_become: false
    # Кластеры, которым нужны секреты. Общий CA у них ОДИН на всех — иначе
    # Cluster Mesh невозможен; ключ шифрования etcd у каждого свой.
    secrets_bootstrap_clusters: []
    secrets_bootstrap_ca_common_name: "Cilium CA"
    secrets_bootstrap_ca_days: 3650
    secrets_bootstrap_etcd_key_name: key1
    # no_log скрывает не только секреты, но и причину отказа. В этом
    # проекте на этом уже теряли время (дефект 31), поэтому его можно
    # отключить на время разбора: -e secrets_bootstrap_no_log=false.
    secrets_bootstrap_no_log: true
    # Lookup-плагины выполняются в процессе ansible и переменные окружения
    # видят; МОДУЛИ запускаются отдельными процессами и их не наследуют —
    # vault_read отвечает «No Vault Token specified or discovered», хотя
    # lookup с той же переменной работает. Поэтому модулям параметры
    # передаются явно.
    secrets_bootstrap_token: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_TOKEN') }}"
    secrets_bootstrap_ca_cert: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_CA_CERT') }}"

  tasks:
    - name: Assert the clusters are listed
      ansible.builtin.assert:
        that:
          - secrets_bootstrap_clusters | length > 0
          - secrets_bootstrap_clusters is not string
        fail_msg: >-
          Передайте список кластеров:
          -e '{"secrets_bootstrap_clusters": ["k8s-east", "k8s-west"]}'.
          Проверка типа обязательна: строка тоже имеет длину, и неверно
          переданный параметр падал бы позже и невнятно.
        quiet: true

    # Обязательная проверка ДО чтения путей кластеров.
    #
    # Ниже пути читаются с errors='ignore': отсутствующий путь — обычное
    # состояние первого прогона. Но точно так же молча возвращается пустота
    # при недоступном хранилище, неверном токене или отсутствующей hvac —
    # и playbook решил бы, что секретов нет, а затем ЗАПИСАЛ БЫ поверх
    # живых. Это ровно то, чего он обещает не делать, поэтому связь с
    # хранилищем проверяется отдельно и громко.
    - name: Assert the secret backend is reachable
      community.hashi_vault.vault_read:
        url: "{{ openbao_url }}"
        token: "{{ secrets_bootstrap_token }}"
        ca_cert: "{{ secrets_bootstrap_ca_cert | default(omit, true) }}"
        path: "{{ openbao_mount_point }}/config"
      register: secrets_bootstrap_probe

    - name: Read what the backend already holds
      # Отсутствующий путь — не ошибка, а обычное состояние первого прогона.
      ansible.builtin.set_fact:
        secrets_bootstrap_existing: >-
          {{ secrets_bootstrap_existing | default({})
             | combine({item: lookup('community.hashi_vault.hashi_vault',
                                     openbao_mount_point ~ '/data/kubernetes/' ~ item,
                                     url=openbao_url,
                                     errors='ignore') | default({}, true)}) }}
      loop: "{{ secrets_bootstrap_clusters }}"
      no_log: "{{ secrets_bootstrap_no_log | bool }}"

    - name: Find an existing shared CA
      # Второй кластер обязан получить ТОТ ЖЕ центр сертификации, что и
      # первый. Поэтому сначала ищем уже записанный, и только если его нет
      # нигде — выпускаем новый.
      ansible.builtin.set_fact:
        secrets_bootstrap_ca: >-
          {{ (secrets_bootstrap_existing.values()
              | selectattr('cilium-ca-cert', 'defined') | list | first)
             | default({}, true) }}
      no_log: "{{ secrets_bootstrap_no_log | bool }}"

    - name: Assert the existing CAs do not diverge
      # Если в разных кластерах уже лежат РАЗНЫЕ центры сертификации, это не
      # чинится дозаписью: mesh между ними не соберётся, и надо решать, какой
      # оставить, переиздавая сертификаты второго.
      ansible.builtin.assert:
        that:
          - (secrets_bootstrap_existing.values()
             | selectattr('cilium-ca-cert', 'defined')
             | map(attribute='cilium-ca-cert') | unique | list | length) <= 1
        fail_msg: >-
          В путях кластеров лежат РАЗНЫЕ общие CA. Cluster Mesh с ними
          невозможен. Playbook не выбирает за оператора: решите, какой
          оставить, и удалите второй вручную.
        quiet: true

    - name: Issue a shared CA
      when: secrets_bootstrap_ca['cilium-ca-cert'] is not defined
      block:
        - name: Create a temporary directory for the CA
          ansible.builtin.tempfile:
            state: directory
            suffix: ca-bootstrap
          register: secrets_bootstrap_tmp

        - name: Generate the CA private key
          community.crypto.openssl_privatekey:
            path: "{{ secrets_bootstrap_tmp.path }}/ca.key"
            type: RSA
            size: 4096
            mode: "0600"

        - name: Generate the CA signing request
          community.crypto.openssl_csr:
            path: "{{ secrets_bootstrap_tmp.path }}/ca.csr"
            privatekey_path: "{{ secrets_bootstrap_tmp.path }}/ca.key"
            common_name: "{{ secrets_bootstrap_ca_common_name }}"
            basic_constraints: ["CA:TRUE"]
            basic_constraints_critical: true
            key_usage: [keyCertSign, cRLSign]
            key_usage_critical: true

        - name: Self-sign the CA certificate
          community.crypto.x509_certificate:
            path: "{{ secrets_bootstrap_tmp.path }}/ca.crt"
            csr_path: "{{ secrets_bootstrap_tmp.path }}/ca.csr"
            privatekey_path: "{{ secrets_bootstrap_tmp.path }}/ca.key"
            provider: selfsigned
            selfsigned_not_after: "+{{ secrets_bootstrap_ca_days }}d"

        - name: Read the generated CA
          ansible.builtin.slurp:
            src: "{{ secrets_bootstrap_tmp.path }}/{{ item }}"
          register: secrets_bootstrap_ca_files
          loop: [ca.crt, ca.key]
          no_log: "{{ secrets_bootstrap_no_log | bool }}"

        - name: Remember the generated CA
          ansible.builtin.set_fact:
            secrets_bootstrap_ca:
              cilium-ca-cert: "{{ secrets_bootstrap_ca_files.results[0].content | b64decode }}"
              cilium-ca-key: "{{ secrets_bootstrap_ca_files.results[1].content | b64decode }}"
          no_log: "{{ secrets_bootstrap_no_log | bool }}"

      always:
        - name: Remove the temporary directory
          ansible.builtin.file:
            path: "{{ secrets_bootstrap_tmp.path }}"
            state: absent
          when: secrets_bootstrap_tmp.path is defined

    - name: Write the missing secrets for every cluster
      # Дозапись, а не замена: к уже лежащему добавляется недостающее.
      # Ключ шифрования etcd у каждого кластера свой — общий не нужен и
      # расширял бы последствия компрометации.
      community.hashi_vault.vault_write:
        url: "{{ openbao_url }}"
        token: "{{ secrets_bootstrap_token }}"
        ca_cert: "{{ secrets_bootstrap_ca_cert | default(omit, true) }}"
        path: "{{ openbao_mount_point }}/data/kubernetes/{{ item }}"
        data:
          data: >-
            {{ secrets_bootstrap_ca
               | combine({'etcd-encryption-key':
                          secrets_bootstrap_existing[item]['etcd-encryption-key']
                          | default(lookup('password',
                                           '/dev/null length=32 chars=ascii_letters,digits')
                                    | b64encode, true),
                          'etcd-encryption-key-name':
                          secrets_bootstrap_existing[item]['etcd-encryption-key-name']
                          | default(secrets_bootstrap_etcd_key_name, true)})
               | combine(secrets_bootstrap_existing[item]) }}
      loop: "{{ secrets_bootstrap_clusters }}"
      no_log: "{{ secrets_bootstrap_no_log | bool }}"

    - name: Report what is stored
      ansible.builtin.debug:
        msg: >-
          Секреты записаны для кластеров:
          {{ secrets_bootstrap_clusters | join(', ') }}.
          Общий CA {{ 'взят существующий'
                      if secrets_bootstrap_existing.values()
                         | selectattr('cilium-ca-cert', 'defined') | list | length > 0
                      else 'выпущен новый' }}.
          Существовавшие значения не изменялись.
