---
# Контейнерные сценарии (Molecule) из проекта удалены: проверка выполняется
# статическим анализом на каждый MR и прогоном на стенде из виртуальных машин
# (раздел 25 документа). Стенд разворачивается вне CI — он требует облачных
# ресурсов и живёт дольше пайплайна.

stages: [lint]

variables:
  PIP_INDEX_URL: "https://pypi.company.local/simple"
  ANSIBLE_FORCE_COLOR: "true"

default:
  image: harbor.company.local/ci/ansible:latest
  before_script:
    - pip install -r requirements-test.txt
    - ansible-galaxy collection install -r requirements.yml -p collections

lint:
  stage: lint
  script:
    - yamllint .
    - ansible-lint
    # Проверяет, что условия assert остались строками: `: ` внутри
    # незакавыченного условия делает его отображением YAML, и условие молча
    # перестаёт проверяться. Ни yamllint, ни ansible-lint этого не видят.
    - python3 scripts/check-assert-conditions.py
    - make syntax
