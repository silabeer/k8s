---
# Stage-контур. Минимальный состав: HA control plane без выделенной пары LB
# (api_vip_managed: false, используется внешний LB стенда), два worker.

all:
  vars:
    ansible_user: ansible
    ansible_become: true

  children:
    load_balancers:
      hosts: {}

    control_plane:
      hosts:
        stage-cp-01:
          ansible_host: 10.20.1.21
        stage-cp-02:
          ansible_host: 10.20.1.22
        stage-cp-03:
          ansible_host: 10.20.1.23

    workers:
      hosts:
        stage-worker-01:
          ansible_host: 10.20.1.31
        stage-worker-02:
          ansible_host: 10.20.1.32

    kubernetes:
      children:
        control_plane:
        workers:
