---
# Тестовый стенд в Yandex Cloud.
#
# ansible_host — ПУБЛИЧНЫЙ адрес, только для SSH.
# node_ip      — ПРИВАТНЫЙ адрес, весь кластерный трафик идёт по нему:
#                --node-ip, advertiseAddress, certSANs, etcd peer, kubelet.
#
# Публичные адреса в кластерную конфигурацию не попадают намеренно: иначе
# apiserver, etcd и kubelet слушали бы на интерфейсе, смотрящем в интернет.
#
# k8s-worker-02 добавлен в inventory ПОСЛЕ установки кластера и вводится
# отдельным playbook'ом maintenance/add-node.yml — это проверка сценария
# расширения работающего кластера (раздел 26).

all:
  vars:
    ansible_user: ubuntu
    ansible_become: true

  children:
    # Выделенной пары LB нет: в Yandex Cloud произвольный VIP на L2
    # не поднять. api_vip_managed выключен, этап 05 пропускается.
    load_balancers:
      hosts: {}

    control_plane:
      hosts:
        k8s-cp-01:
          ansible_host: 89.169.168.110
          node_ip: 10.129.0.5
        k8s-cp-02:
          ansible_host: 84.201.143.83
          node_ip: 10.129.0.24
        k8s-cp-03:
          ansible_host: 51.250.101.58
          node_ip: 10.129.0.27

    workers:
      hosts:
        k8s-worker-01:
          ansible_host: 89.169.164.2
          node_ip: 10.129.0.30
        k8s-worker-02:
          ansible_host: 51.250.24.90
          node_ip: 10.129.0.36

    kubernetes:
      children:
        control_plane:
        workers:
