---
# Пороги снижены под фактические ВМ стенда: 4 vCPU, 3.9 ГБ RAM, 20 ГБ диск.
# Производственные значения (раздел 5.2) — 4 vCPU, 8–16 ГБ, 80 ГБ плюс
# отдельный диск под etcd.
preflight_min_cpu: 2
preflight_min_ram_mb: 3500
preflight_min_disk_root_gb: 10

# Отдельного диска под etcd нет: данные лягут на корневой раздел.
# Для production это недопустимо — etcd чувствителен к задержкам fsync
# и конкуренции за IO с системными логами.
etcd_disk_manage: false

preflight_required_ports:
  - 6443
  - 2379
  - 2380
  - 10250
