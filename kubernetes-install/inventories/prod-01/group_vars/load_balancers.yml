---
# Минимальные ресурсы LB (раздел 5.2 playbook)
preflight_min_cpu: 2
preflight_min_ram_mb: 4000
preflight_min_disk_root_gb: 40

haproxy_package_version: ~ # "2.8.*" — закрепить
keepalived_package_version: ~ # "1:2.2.*" — закрепить

# HAProxy
haproxy_stats_enabled: true
haproxy_stats_port: 8404
haproxy_stats_bind: "127.0.0.1"

# Проверка backend делается по HTTP /readyz, а не голым TCP (S6):
# TCP-проверка отдаёт трафик apiserver'у, который слушает порт, но ещё
# не готов обслуживать запросы.
haproxy_check_path: /readyz
haproxy_check_interval: "3s"
haproxy_check_fall: 2
haproxy_check_rise: 3

# Keepalived
keepalived_virtual_router_id: 51
keepalived_advert_int: 1
keepalived_auth_type: PASS
# keepalived_auth_pass берётся из секрет-бэкенда, не хранится в inventory.

# VRRP использует protocol 112 между узлами пары.
preflight_required_ports:
  - 6443
