---
# Домен доверия. Обязан совпадать во всех кластерах: он входит в каждый
# SPIFFE ID, и разные домены делают межкластерную аутентификацию
# невозможной (ADR 0002).
spire_trust_domain: "spiffe.platform.local"

# Кластеры, узлам которых сервер доверяет. Для каждого нужен kubeconfig
# НА СЕРВЕРЕ: аттестатор k8s_psat проверяет токен обращением к apiserver
# того кластера.
#
# Пусто, пока кластеров нет. Роль откажется работать с пустым списком —
# это осознанно: сервер без кластеров поднимется, но ни один узел не
# пройдёт аттестацию, и молчаливо рабочим он выглядеть не должен.
spire_clusters: []
