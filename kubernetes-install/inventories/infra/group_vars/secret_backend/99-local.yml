---
# Публичный адрес обязан входить в SAN сертификата: управляющая машина
# ходит в OpenBao именно по нему — внутренний адрес ей недоступен, а lookup
# выполняется на ней, а не на узлах. Без этого проверка сертификата не
# проходит, и отказ выглядит как ошибка маршрута или имени.
openbao_tls_san_ip:
  - "{{ ansible_default_ipv4.address }}"
  - 111.88.145.255
  - 127.0.0.1
