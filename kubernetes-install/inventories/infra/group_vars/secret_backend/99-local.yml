---
openbao_tls_san_ip:
  - "{{ ansible_default_ipv4.address }}"
  - 89.169.186.64
  - 127.0.0.1

# Имя, по которому клиенты ACME обращаются к каталогу: оно обязано быть в
# SAN, иначе клиент отвергает сертификат ещё до первого запроса.
openbao_tls_san_dns:
  - "{{ inventory_hostname }}"
  - openbao.stand.local
  - localhost
