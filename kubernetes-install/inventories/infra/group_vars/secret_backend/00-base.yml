---
# Адрес, по которому клиенты обращаются к OpenBao. Должен совпадать с тем,
# что попадёт в SAN сертификата, иначе подключение падает на проверке имени.
openbao_api_addr: "https://{{ ansible_host }}:{{ openbao_port }}"

# В SAN обязаны попасть ОБА адреса: публичный — для управляющей машины,
# приватный — для узлов кластеров.
openbao_tls_san_dns:
  - "{{ inventory_hostname }}"
  - localhost
openbao_tls_san_ip:
  - "{{ ansible_host }}"
  - "{{ node_ip }}"
  - 127.0.0.1

# Распечатывание ключами из файла — удобство стенда. Для production
# оставить false: ключи рядом с хранилищем равнозначны незапечатанному.
openbao_auto_unseal: true
