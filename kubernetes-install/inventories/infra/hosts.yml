---
# Общие службы, обслуживающие ВСЕ кластеры: секрет-бэкенд и сервер SPIRE.
#
# Вынесены в отдельный инвентарь намеренно. Класть их в инвентарь кластера
# неверно: сервер один на все контуры, а инвентарь кластера описывает один
# кластер. При двух кластерах пришлось бы дублировать хост, и рано или
# поздно копии разошлись бы.
#
# Адреса — плейсхолдеры. Фактические кладутся в hosts.local.yml, который
# в git не попадает.

all:
  vars:
    ansible_user: ubuntu
    ansible_become: true

  children:
    # OpenBao. Должен быть доступен С УПРАВЛЯЮЩЕЙ МАШИНЫ по 8200: lookup
    # community.hashi_vault выполняется там, а не на узлах кластеров.
    secret_backend:
      hosts:
        openbao-01:
          ansible_host: 203.0.113.30 # заменить на публичный адрес
          node_ip: 10.129.0.30 # заменить на приватный

    # SPIRE. Обращается к apiserver КАЖДОГО кластера для аттестации узлов,
    # поэтому ему нужен сетевой доступ в кластеры, а не только из них.
    spire_servers:
      hosts:
        spire-01:
          ansible_host: 203.0.113.31
          node_ip: 10.129.0.31
