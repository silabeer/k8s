---
# Тестовый стенд в облаке (проверялся на Yandex Cloud).
#
# Адреса — плейсхолдеры. Подставьте фактические перед прогоном:
#
# Балансировщик входит в подготовку стенда наравне с узлами: его имя
# служит адресом API endpoint и обязано резолвиться на всех машинах.
#
#   ansible_host — ПУБЛИЧНЫЙ адрес, только для SSH.
#   node_ip      — ПРИВАТНЫЙ адрес, весь кластерный трафик идёт по нему:
#                  --node-ip, advertiseAddress, certSANs, etcd peer, kubelet.
#
# Разделение принципиально: публичные адреса в кластерную конфигурацию
# не попадают, иначе apiserver, etcd и kubelet слушали бы на интерфейсе,
# смотрящем в интернет.
#
# Порядок ввода узлов при проверке сценария расширения: сначала поднять
# кластер на 3 control-plane и 1 worker, затем добавить второй worker
# через playbooks/maintenance/add-node.yml -e new_node=k8s-m-worker-02.

all:
  vars:
    ansible_user: ubuntu
    ansible_become: true

  children:
    # Выделенный узел с HAProxy — как в production (раздел 3.2), а не адрес
    # одного из control-plane узлов.
    #
    # Пары нет: в облаке произвольный VIP на L2 не поднять, поэтому
    # keepalived выключен (group_vars/load_balancers.yml), а endpoint'ом
    # служит собственный адрес балансировщика. Отказоустойчивости у такой
    # схемы НЕТ — способы её обеспечить разобраны в
    # docs/adr/0001-kube-proxy-replacement.md, раздел 4.1.
    load_balancers:
      hosts:
        k8s-m-lb-01:
          ansible_host: 203.0.113.10 # заменить на публичный адрес
          node_ip: 10.129.0.10 # заменить на приватный; это и есть api_vip

    control_plane:
      hosts:
        k8s-m-cp-01:
          ansible_host: 203.0.113.11 # заменить на публичный адрес
          node_ip: 10.129.0.11 # заменить на приватный адрес
        k8s-m-cp-02:
          ansible_host: 203.0.113.12
          node_ip: 10.129.0.12
        k8s-m-cp-03:
          ansible_host: 203.0.113.13
          node_ip: 10.129.0.13

    workers:
      hosts:
        k8s-m-worker-01:
          ansible_host: 203.0.113.21
          node_ip: 10.129.0.21
        k8s-m-worker-02:
          ansible_host: 203.0.113.22
          node_ip: 10.129.0.22

    kubernetes:
      children:
        control_plane:
        workers:
