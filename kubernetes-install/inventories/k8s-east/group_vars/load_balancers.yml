---
# Балансировщик API endpoint на стенде.
#
# Keepalived выключен: в облаке произвольный VIP на L2 не поднять — фабрика
# о таком адресе не знает, и keepalived, назначив его своему интерфейсу,
# создал бы видимость работы при недоступном адресе. Endpoint'ом служит
# собственный приватный адрес балансировщика.
#
# Отказоустойчивости при такой схеме НЕТ: балансировщик — точка отказа.
# Способы её убрать разобраны в docs/adr/0001-kube-proxy-replacement.md,
# раздел 4.1.
keepalived_enabled: false

# Требования к ресурсам у балансировщика свои: ему не нужны ресурсы узла
# Kubernetes. Без переопределения к нему применяются пороги кластерного
# узла — так и произошло при первом прогоне.
#
# Пороги заданы НИЖЕ номинального размера ВМ намеренно: машина «2 ГБ»
# сообщает 1966 МБ, часть памяти забирают прошивка и ядро. Порог, равный
# номиналу, не проходит никогда.
preflight_min_cpu: 2
preflight_min_ram_mb: 1800
preflight_min_disk_root_gb: 10

# Версии закрепляются: роль отказывается работать с плавающими.
haproxy_package_version: "2.8.*"

# Не нужна при выключенном keepalived, но оставлена закреплённой, чтобы
# включение не потребовало правки в двух местах.
keepalived_package_version: "1:2.2.*"

# HAProxy слушает собственный адрес, а не VIP: подниматься нечему.
haproxy_ip_nonlocal_bind: false
