---
# Общие переменные для всех molecule-сценариев.
#
# Подключаются через provisioner.inventory.links.group_vars, чтобы не
# дублировать полсотни переменных в каждом сценарии.
#
# Значения тестовые. Версии закреплены отдельно от production: сценарии
# должны проходить, даже когда в inventory версии ещё не проставлены.

cluster_name: molecule
cluster_environment: test

kubernetes_version: "1.31.4"
kubernetes_apt_version: "1.31.4-1.1"
containerd_version: "2.0.2"
runc_version: "1.2.4"
cni_plugins_version: "1.6.2"
crictl_version: "1.31.1"
helm_version: "3.16.3"
pause_image_tag: "3.10"

api_vip: "10.99.0.20"
api_vip_managed: false
api_vip_interface: "eth0"
api_vip_cidr_prefix: 24

control_plane_endpoint_host: "k8s-api.molecule.test"
control_plane_endpoint_port: 6443
control_plane_endpoint: "{{ control_plane_endpoint_host }}:{{ control_plane_endpoint_port }}"

pod_network_cidr: "10.100.0.0/16"
service_network_cidr: "10.101.0.0/16"
cluster_dns: "10.101.0.10"
cluster_domain: "cluster.local"
node_mtu: 1500

corporate_networks:
  - "10.99.0.0/16"

# Эндпоинты берутся из окружения: сценарии, которые реально ставят пакеты
# (containerd, kubernetes_packages), обращаются к внутреннему зеркалу, а оно
# у каждого контура своё. CI задаёт переменные окружения, локальный прогон
# использует дефолты.
registry_host: "{{ lookup('env', 'MOLECULE_REGISTRY_HOST') | default('harbor.company.local', true) }}"
mirror_host: "{{ lookup('env', 'MOLECULE_MIRROR_HOST') | default('mirror.company.local', true) }}"
artifacts_host: "{{ lookup('env', 'MOLECULE_ARTIFACTS_HOST') | default('artifacts.company.local', true) }}"

image_repository: "{{ registry_host }}/k8s"
pause_image: "{{ registry_host }}/k8s/pause:{{ pause_image_tag }}"

registry_mirrors:
  - upstream: "docker.io"
    host: "https://{{ registry_host }}/v2/proxy-docker.io"
    capabilities: ["pull", "resolve"]
    override_path: true
  - upstream: "registry.k8s.io"
    host: "https://{{ registry_host }}/v2/proxy-registry.k8s.io"
    capabilities: ["pull", "resolve"]
    override_path: true

kubernetes_minor_version: "{{ kubernetes_version | regex_replace('^(\\d+\\.\\d+).*$', '\\1') }}"
kubernetes_apt_repo_url: "https://{{ mirror_host }}/kubernetes/core:/stable:/v{{ kubernetes_minor_version }}/deb/"
kubernetes_apt_repo_key_url: "{{ kubernetes_apt_repo_url }}Release.key"

containerd_install_method: binary
artifacts_base_url: "https://{{ artifacts_host }}"
containerd_tarball_url: "{{ artifacts_base_url }}/containerd/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
runc_binary_url: "{{ artifacts_base_url }}/runc/runc.amd64-{{ runc_version }}"
cni_plugins_tarball_url: "{{ artifacts_base_url }}/cni-plugins/cni-plugins-linux-amd64-v{{ cni_plugins_version }}.tgz"
helm_tarball_url: "{{ artifacts_base_url }}/helm/helm-v{{ helm_version }}-linux-amd64.tar.gz"

cni:
  name: cilium
  version: "1.16.5"
  chart_source: oci
  chart_name: cilium
  chart_oci: "oci://{{ registry_host }}/charts/cilium"
  chart_repo: "https://helm.cilium.io/"

gitops:
  # Тестовый GitOps-репозиторий задаётся окружением. Он должен быть отдельным
  # от production (раздел 25.5). Сценарии bootstrap-ролей падают с внятным
  # сообщением, если переменная не задана.
  repo_url: "{{ lookup('env', 'MOLECULE_GITOPS_REPO') | default('ssh://git@git.molecule.test/platform/kubernetes-gitops.git', true) }}"
  revision: main
  cluster_path: "clusters/{{ cluster_name }}"
  ssh_host: "git.molecule.test"
  ssh_port: 22

argocd:
  version: "7.7.11"
  namespace: argocd
  chart_source: oci
  chart_name: argo-cd
  chart_oci: "oci://{{ registry_host }}/charts/argo-cd"
  chart_repo: "https://argoproj.github.io/argo-helm"
  field_manager: argocd-controller
  root_app_automated: false

# В тестах секреты берутся из ansible-vault файла, а не из OpenBao:
# сценарий должен проходить без внешних систем.
secret_backend: vault_file
vault_file_path: "{{ playbook_dir }}/secrets.yml"
openbao_url: "https://openbao.molecule.test"
openbao_mount_point: "kv"
openbao_cluster_path: "kubernetes/{{ cluster_name }}"

etcd_encryption_provider: secretbox
etcd_encryption_resources:
  - secrets
etcd_kms_name: openbao
etcd_kms_endpoint: "unix:///var/run/kmsplugin/socket.sock"
etcd_kms_timeout: "3s"

audit_log_dir: /var/log/kubernetes/audit
audit_log_max_age: 30
audit_log_max_backup: 10
audit_log_max_size: 100

pod_security_admission_enabled: true
pod_security_admission_enforce: baseline
pod_security_admission_enforce_version: latest
pod_security_admission_audit: restricted
pod_security_admission_warn: restricted
pod_security_admission_exempt_namespaces:
  - kube-system

tls_min_version: VersionTLS12
tls_cipher_suites:
  - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
  - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
  - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
  - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

kubelet_system_reserved:
  cpu: "500m"
  memory: "1Gi"
  ephemeral-storage: "5Gi"
kubelet_kube_reserved:
  cpu: "500m"
  memory: "1Gi"
  ephemeral-storage: "5Gi"
kubelet_eviction_hard:
  memory.available: "500Mi"
  nodefs.available: "10%"
  nodefs.inodesFree: "5%"
  imagefs.available: "15%"

ntp_servers:
  - "ntp.molecule.test"
ntp_max_offset_seconds: 1

kubeconfig_path: /etc/kubernetes/admin.conf
os_root_ca_certificates: []
firewall_manage: false
os_http_proxy: ""
os_https_proxy: ""
os_no_proxy: "localhost,127.0.0.1"

# =============================================================================
# Расхождения контейнерного стенда с production
#
# Все сценарии выполняются в Docker. Три вещи в контейнере проверить нельзя,
# и они выключены здесь явно, а не спрятаны по сценариям. Каждая закрыта
# другой проверкой — см. README, раздел «Тестирование».
# =============================================================================

# 1. Отдельный диск под etcd. Блочное устройство контейнеру не подключить.
#    /var/lib/etcd вынесен в анонимный docker-том, что даёт настоящую
#    файловую систему вместо overlay поверх overlay.
etcd_disk_manage: false

# 2. Swap. /proc/swaps внутри контейнера показывает swap ХОСТА, а `swapoff`
#    из privileged-контейнера отключил бы его на хосте. Поэтому роль swap
#    не трогает, а kubelet его игнорирует.
os_prepare_manage_swap: false
kubelet_fail_swap_on: false

# 3. protectKernelDefaults. kernel.* не изолируются namespace: внутри
#    контейнера kubelet видит значения хоста, а Docker не даёт задать их
#    через `sysctls`. По умолчанию выключено.
#
#    Если хост CI подготовлен (`make ci-host-prereq`), выставьте
#    MOLECULE_HOST_SYSCTLS_SET=true — и сценарий проверит настоящее
#    поведение kubelet.
#
#    Независимо от этого корректность самого набора из шести значений
#    проверяет сценарий роли kernel: он сверяет отрендеренный sysctl.d
#    с тем, что требует kubelet (регрессия на блокер B1).
kubelet_protect_kernel_defaults: "{{ lookup('env', 'MOLECULE_HOST_SYSCTLS_SET') | default('false', true) | bool }}"

# hostname контейнера задаёт Docker
os_prepare_manage_hostname: false

# Проверки preflight, которым нужны внутренние зеркала и реальная сетевая
# инфраструктура. В контейнерном стенде их нет.
preflight_check_package_repo: false
preflight_check_artifacts: false
# MTU в контейнере задаёт Docker, с производственным значением он не совпадает.
preflight_check_mtu: false
# В контейнере время принадлежит хосту: свой NTP-демон не нужен и не стартует.
# Фактическое расхождение часов при этом проверяется.
preflight_check_timesync_service: false
# /etc/hosts в контейнере — bind-mount, атомарная замена через rename
# невозможна (EBUSY).
os_prepare_hosts_unsafe_writes: true
