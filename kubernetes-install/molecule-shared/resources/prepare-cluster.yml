---
# Общий prepare для кластерных сценариев.
#
# Поднимает стенд до состояния «узлы присоединены, CNI ещё нет»,
# переиспользуя реальные playbook проекта. Роли, которые тестируются поверх
# этого состояния, подключают файл из своего prepare.yml.

- name: Bootstrap the containers
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Базовый образ может не содержать python — до его установки доступен
    # только raw.
    - name: Install python and basic tooling
      ansible.builtin.raw: |
        set -e
        apt-get update -qq
        apt-get install -y -qq python3 ca-certificates curl gnupg iproute2 iputils-ping
      changed_when: true

    - name: Gather facts after bootstrap
      ansible.builtin.setup:

    # kubelet отказывается стартовать без /dev/kmsg. Устройство пробрасывается
    # в контейнер через `devices` в molecule.yml; если хост его не отдаёт,
    # подставляем /dev/console, как это делает kind.
    - name: Ensure /dev/kmsg exists
      ansible.builtin.raw: |
        test -e /dev/kmsg || ln -s /dev/console /dev/kmsg
      changed_when: false

    # На стенде нет корпоративного DNS: имя API endpoint резолвится через
    # /etc/hosts. В production эта запись создаётся заранее (раздел 5.4)
    # и проверяется preflight.
    - name: Point the API endpoint hostname at its address
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ api_vip }} {{ control_plane_endpoint_host }}"
        regexp: ".*{{ control_plane_endpoint_host }}$"
        state: present

- name: Stage 00 — preflight checks
  import_playbook: ../../playbooks/00-preflight.yml

- name: Stage 10 — operating system preparation
  import_playbook: ../../playbooks/10-os-prepare.yml

- name: Stage 20 — containerd
  import_playbook: ../../playbooks/20-containerd.yml

- name: Stage 30 — Kubernetes packages
  import_playbook: ../../playbooks/30-kubernetes-packages.yml

- name: Stage 40 — first control-plane node
  import_playbook: ../../playbooks/40-control-plane-init.yml

- name: Stage 42 — worker nodes
  import_playbook: ../../playbooks/42-workers-join.yml
