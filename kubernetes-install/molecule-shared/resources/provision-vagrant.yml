---
# Провайдер Vagrant + libvirt для локальной разработки.
#
# `vagrant ssh-config` запрашивается по одному узлу: разбор одного блока
# однозначен, тогда как разбиение общего вывода на блоки зависит от версии
# Vagrant и легко ломается.

- name: Bring up the Vagrant environment
  ansible.builtin.command:
    cmd: vagrant up --provider libvirt
    chdir: "{{ resources_dir }}"
  environment:
    VAGRANT_VAGRANTFILE: Vagrantfile
  register: vagrant_up
  changed_when: "'Machine already provisioned' not in vagrant_up.stdout"

- name: Read the SSH configuration for each node
  ansible.builtin.command:
    cmd: "vagrant ssh-config {{ item }}"
    chdir: "{{ resources_dir }}"
  environment:
    VAGRANT_VAGRANTFILE: Vagrantfile
  loop: "{{ molecule_vagrant_nodes }}"
  register: vagrant_ssh_configs
  changed_when: false

- name: Build the instance list
  ansible.builtin.set_fact:
    molecule_instances: >-
      {{ molecule_instances | default([]) + [{
           'instance': item.item,
           'address': (fields['hostname'] | default('')),
           'user': (fields['user'] | default('vagrant')),
           'port': (fields['port'] | default('22')) | int,
           'identity_file': (fields['identityfile'] | default('')),
         }] }}
  vars:
    # Строки вида "  HostName 192.168.121.21" превращаются в
    # {'hostname': '192.168.121.21', ...}
    fields: >-
      {{ dict(item.stdout_lines
              | map('trim') | reject('equalto', '')
              | map('regex_replace', '^(\S+)\s+(.*)$', '\1|\2')
              | map('split', '|')
              | map('first') | map('lower')
              | zip(item.stdout_lines
                    | map('trim') | reject('equalto', '')
                    | map('regex_replace', '^(\S+)\s+(.*)$', '\2'))) }}
  loop: "{{ vagrant_ssh_configs.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert every node got an address
  ansible.builtin.assert:
    that:
      - molecule_instances | rejectattr('address') | list | length == 0
    fail_msg: >-
      Не для всех узлов получен адрес:
      {{ molecule_instances | rejectattr('address') | map(attribute='instance') | list }}
    quiet: true
