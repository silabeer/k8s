---
# Стенд уничтожается после каждого прогона, чтобы не накапливать дрейф
# (раздел 25.5).

- name: Destroy test instances
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    molecule_provider: "{{ lookup('env', 'MOLECULE_PROVIDER') | default('vagrant', true) }}"
    resources_dir: "{{ playbook_dir }}"

  tasks:
    - name: Destroy the Vagrant environment
      ansible.builtin.command:
        cmd: vagrant destroy -f
        chdir: "{{ resources_dir }}"
      environment:
        VAGRANT_VAGRANTFILE: Vagrantfile
      register: vagrant_destroy
      changed_when: vagrant_destroy.rc == 0
      failed_when: false
      when: molecule_provider == 'vagrant'

    - name: Report zvirt teardown is not implemented
      ansible.builtin.debug:
        msg: >-
          Провайдер zvirt не реализован — уничтожение стенда выполняется
          средствами CI. См. provision-zvirt.yml.
      when: molecule_provider == 'zvirt'

    - name: Truncate the instance config
      ansible.builtin.copy:
        content: "{{ [] | to_nice_yaml }}"
        dest: "{{ molecule_ephemeral_directory }}/instance_config.yml"
        mode: "0600"
